<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8fafc;--bg3:#f1f5f9;--border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --blue:#3b82f6;--blue2:#1d4ed8;--blue-bg:#eff6ff;
  --r:5px;--r2:8px;--sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 8px 30px rgba(0,0,0,.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg2);min-height:100vh}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:48px;gap:10px;flex-shrink:0;box-shadow:var(--sh)}
.logo{font-size:14px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}.logo em{color:var(--blue);font-style:normal}
.tabs{display:flex;height:100%}
.tab{padding:0 12px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--text2);border-bottom:2px solid transparent;height:100%;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--blue);font-weight:600}
.tab:hover:not(.on){color:var(--text)}
.cnt{font-size:10px;background:var(--bg3);color:var(--text2);padding:1px 5px;border-radius:8px;font-weight:600}
.tab.on .cnt{background:var(--blue-bg);color:var(--blue2)}
.sp{flex:1}
.btn{padding:5px 11px;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500;border:1px solid var(--border2);background:var(--bg);color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--bg3)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-p:hover{background:var(--blue2)}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed}.btn-v:hover{background:#6d28d9}
.btn-g{background:#059669;color:#fff;border-color:#059669}.btn-g:hover{background:#047857}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.ibt{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px;border-radius:3px;font-size:12px}
.ibt:hover{color:var(--text);background:var(--bg3)}
/* Export dropdown */
.exp-drop{position:relative;display:inline-flex}
.exp-menu{position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh2);z-index:200;min-width:200px;padding:4px 0;display:none}
.exp-menu.open{display:block}
.exp-item{display:flex;align-items:center;gap:8px;padding:7px 13px;font-size:12px;cursor:pointer;color:var(--text)}
.exp-item:hover{background:var(--bg2)}.exp-item svg{color:var(--text3);flex-shrink:0}
.exp-sep{height:1px;background:var(--border);margin:3px 0}
.exp-label{padding:6px 13px 3px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
/* Filters */
.fbar{background:var(--bg);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.srch{position:relative;display:flex;align-items:center}
.srch svg{position:absolute;left:7px;color:var(--text3);pointer-events:none}
.srch input{padding:5px 8px 5px 26px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg2);color:var(--text);outline:none;width:195px}
.srch input:focus{border-color:var(--blue);background:#fff}
.fsel{padding:5px 8px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;outline:none}
.chips{display:flex;gap:3px}.chip{padding:3px 9px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--text2)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}.chip:hover:not(.on){background:var(--bg3)}
/* Content & Table */
.content{flex:1;overflow-y:auto;padding:14px 16px}
.stats{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:7px 12px;display:flex;align-items:baseline;gap:5px;box-shadow:var(--sh)}
.sn{font-size:17px;font-weight:700}.sl{font-size:11px;color:var(--text2)}
.tw{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12px}
tbody tr:not(.exp-row){cursor:pointer}
tbody tr:not(.exp-row):hover td{background:#fafbfd}
tr:last-child td{border-bottom:none}
.exp-row td{padding:0;border-bottom:1px solid var(--border2)}.exp-row:last-child td{border-bottom:none}
/* Contact icons */
.contact-icons{display:flex;gap:3px;flex-wrap:wrap}
.cicon{display:inline-flex;align-items:center;justify-content:center;padding:2px 5px;border-radius:3px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid;white-space:nowrap;position:relative}
.cicon:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:3px 7px;border-radius:3px;font-size:10px;white-space:nowrap;pointer-events:none;z-index:50}
.ci-wc{background:#07c160;color:#fff;border-color:#07c160}.ci-wa{background:#25d366;color:#fff;border-color:#25d366}
.ci-em{background:#3b82f6;color:#fff;border-color:#3b82f6}.ci-ph{background:#6366f1;color:#fff;border-color:#6366f1}
.ci-li{background:#0a66c2;color:#fff;border-color:#0a66c2}.ci-ot{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.copied-flash{position:fixed;top:20px;right:20px;background:#0f172a;color:#fff;padding:6px 12px;border-radius:var(--r);font-size:12px;z-index:999;pointer-events:none}
/* Badges */
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.b-cn{background:#dbeafe;color:#1e40af}.b-mx{background:#dcfce7;color:#14532d}
.b-na{background:#fef3c7;color:#78350f}.b-ot{background:#f3e8ff;color:#581c87}
.b-exploring{background:var(--bg3);color:var(--text2)}.b-active{background:#eff6ff;color:#1d4ed8}.b-ready{background:#f0fdf4;color:#15803d}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-h{background:#ef4444}.dot-m{background:#f59e0b}.dot-l{background:#cbd5e1}
/* Name cell */
.nc strong{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}
.nc .role{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}
.nc .co{font-size:11px;color:var(--blue2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}
.tags{display:flex;flex-wrap:wrap;gap:2px;max-width:175px}
.tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;background:var(--bg3);color:var(--text2);max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-n{background:#eff6ff;color:#1d4ed8}
.desc{font-size:11px;color:var(--text2);line-height:1.45;max-width:215px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* Expanded row */
.exp-panel{padding:14px 16px;background:#fafbfc;border-left:3px solid var(--blue)}
.exp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:12px}
.exp-col h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:7px}
.exp-field{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin-bottom:4px}
.exp-label{color:var(--text3);width:58px;flex-shrink:0;font-size:11px;padding-top:1px}
.exp-val{color:var(--text);word-break:break-word;font-size:12px}
.ecb{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;margin:2px 2px 2px 0}
.ecb-wc{background:#e7f9f0;color:#07c160;border-color:#07c160}.ecb-wa{background:#e6f9ec;color:#128c7e;border-color:#25d366}
.ecb-em{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd}.ecb-ph{background:#eef2ff;color:#4f46e5;border-color:#a5b4fc}
.ecb-li{background:#e8f0f9;color:#0a66c2;border-color:#93c4e8}.ecb-ot{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.exp-desc{font-size:12px;color:var(--text2);line-height:1.55;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.exp-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
.offer-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;margin:2px 2px 2px 0;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.need-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;margin:2px 2px 2px 0;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
/* Score & Match */
.score{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.sc-hi{background:#f0fdf4;color:#15803d;border:1.5px solid #86efac}.sc-md{background:#fffbeb;color:#92400e;border:1.5px solid #fcd34d}
.mx-panel{padding:16px;background:#f8faff;border-left:3px solid var(--blue)}
.mx-grid{display:grid;grid-template-columns:1fr 36px 1fr;gap:10px;margin-bottom:12px;align-items:start}
.mx-side{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:11px}
.mx-side h5{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.mx-arrow{display:flex;align-items:center;justify-content:center;padding-top:28px;color:var(--text3);font-size:20px}
.mx-reason{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.mx-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.intro-box{margin-top:10px;padding:10px 12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:var(--r);font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.status-sel{font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--text2);cursor:pointer}
/* Smart match */
.sm-prompt-box{background:linear-gradient(135deg,#f5f3ff 0%,#eff6ff 100%);border:1px solid #ddd6fe;border-radius:var(--r2);padding:14px;margin-bottom:14px}
.sm-prompt-box label{font-size:11px;font-weight:700;color:#6d28d9;display:block;margin-bottom:6px}
.sm-prompt-box textarea{width:100%;padding:9px;border:1px solid #c4b5fd;border-radius:var(--r);font-size:13px;background:#fff;color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:90px;line-height:1.5}
.sm-result-card{border:1px solid var(--border);border-radius:var(--r2);padding:12px;margin-bottom:8px;border-left:3px solid #7c3aed;background:#fdfcff}
.sm-result-card .smr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sm-result-card .smr-names{font-size:13px;font-weight:600}
.sm-result-card .smr-cos{font-size:11px;color:var(--text2);margin-top:2px}
.sm-result-card .smr-reason{font-size:12px;color:var(--text2);line-height:1.45}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:45px;overflow-y:auto}
.modal{background:#fff;border-radius:10px;width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);margin:auto}
.modal-lg{width:720px}
.mhd{padding:15px 20px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.mhd h2{font-size:14px;font-weight:700}
.mbody{padding:16px 20px}
.mfoot{padding:11px 20px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
/* Form */
.fg{margin-bottom:11px}.fl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.fi,.fs,.fta{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:#fff;color:var(--text);font-family:inherit;outline:none}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--blue)}
.fta{resize:vertical;line-height:1.5}
.frow{display:flex;gap:10px}.frow .fg{flex:1}
.fsec{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-top:1px solid var(--border);margin-top:4px}
/* Loading & error */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;color:var(--text2)}
.loading-screen h2{font-size:16px;font-weight:600;color:var(--text)}
.empty{text-align:center;padding:50px 20px;color:var(--text2)}
.empty h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty p{font-size:12px;line-height:1.5}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:8px 14px;border-radius:var(--r);font-size:12px;z-index:300;box-shadow:var(--sh2)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle}
.spin-lg{width:24px;height:24px;border-width:3px;border-color:rgba(59,130,246,.2);border-top-color:var(--blue)}
.spin-d{border-color:rgba(100,100,100,.2);border-top-color:var(--text2)}
@keyframes sp{to{transform:rotate(360deg)}}
.divider-text{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--text3);font-size:11px}
.divider-text::before,.divider-text::after{content:'';flex:1;height:1px;background:var(--border)}
.tip{font-size:10px;color:var(--text3);margin-top:3px}
/* Saving indicator */
.save-indicator{position:fixed;bottom:20px;left:20px;background:#f0fdf4;border:1px solid #86efac;color:#15803d;padding:6px 12px;border-radius:var(--r);font-size:11px;font-weight:500;z-index:300;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" style="display:none"></div>
<div id="save-ind" class="save-indicator">Saved to cloud</div>

<script>
'use strict';

// ── Constants ──
var REGIONS={china:{label:'China',short:'CN',cls:'b-cn',color:'#1e40af'},mexico:{label:'Mexico',short:'MX',cls:'b-mx',color:'#14532d'},north_america:{label:'N. America',short:'NA',cls:'b-na',color:'#78350f'},others:{label:'Others',short:'OT',cls:'b-ot',color:'#581c87'}};
var STAGES={exploring:{label:'Exploring',cls:'b-exploring'},active:{label:'Active',cls:'b-active'},ready:{label:'Ready',cls:'b-ready'}};
var PRIORITY={high:{label:'High',dot:'dot-h'},medium:{label:'Medium',dot:'dot-m'},low:{label:'Low',dot:'dot-l'}};
var CTYPES=['Manufacturer','Distributor','Importer','Exporter','Service Provider','Investor','Platform','Brand','Consultant','Other'];
var SECTORS=['Manufacturing','Logistics','Legal/Tax','Customs','E-commerce','Industrial Park','Distribution','Automotive','Electronics','Food & Beverage','Medical Devices','Energy/Solar','Consulting','Finance','Real Estate','Other'];
var SOURCES=['Douyin','Xiaohongshu','WeChat Group','Referral','Event/Conference','Cold Outreach','Other'];
var BUDGETS=['Unknown','< $50K','$50K - $500K','$500K - $5M','$5M+'];
var SCALES=['Unknown','Startup / Solo','SME (< 200 staff)','Mid-size (200-2000)','Large (2000+)'];
var MATCH_ST={suggested:'Suggested',introduced:'Introduced',in_progress:'In Progress',closed:'Closed'};

var PARSE_SYS=`Extract ALL business contacts from text. Return ONLY valid JSON. SKIP anyone named Yang Xiang, 向阳, or Yang.
{"contacts":[{"name":"","title":"","company":"","companyType":"Manufacturer|Distributor|Importer|Exporter|Service Provider|Investor|Platform|Brand|Consultant|Other","website":"","region":"china|mexico|north_america|others","sector":"Manufacturing|Logistics|Legal/Tax|Customs|E-commerce|Industrial Park|Distribution|Automotive|Electronics|Food & Beverage|Medical Devices|Energy/Solar|Consulting|Finance|Real Estate|Other","stage":"exploring|active|ready","priority":"high|medium|low","wechat":"","whatsapp":"","email":"","phone":"","linkedin":"","otherContact":"","offers":[],"needs":[],"budget":"Unknown|< $50K|$50K - $500K|$500K - $5M|$5M+","scale":"Unknown|Startup / Solo|SME (< 200 staff)|Mid-size (200-2000)|Large (2000+)","source":"Douyin|Xiaohongshu|WeChat Group|Referral|Event/Conference|Cold Outreach|Other","description":"2-3 sentence summary"}]}`;
var MATCH_SYS=`Expert business matchmaker for cross-border trade. Find best matches between ALL contacts — any direction (China-Mexico, US-China, Mexico-US, etc.). Return ONLY JSON.
{"matches":[{"idA":"","idB":"","score":8,"reason":"2-3 sentences on specific value"}]}
Score 1-10, include only 6+. Max 20. Sort by score desc.`;
var SMART_SYS=`Expert business matchmaker. Based on user's specific request, find the BEST matches from ALL contacts. Return ONLY JSON.
{"matches":[{"idA":"","idB":"","score":9,"reason":"2-3 sentences tied to user's request"}]}
If anchor contact provided, use their ID as idA. Score 1-10 (only 6+). Max 8. Sort desc.`;

// ── State ──
var S={
  contacts:[],matches:[],
  tab:'contacts',
  filters:{q:'',region:'all',sector:'all',stage:'all',priority:'all'},
  mFilter:'all',
  loading:true,loadError:'',
  parsing:false,matching:false,smartMatching:false,generatingIntro:false,
  saving:false,
  parsed:null,parseRaw:'',
  editing:null,
  expanded:{},mExpanded:{},smartResults:null,
  introText:{},
  exportOpen:false,
};

// ── API helpers ──
async function api(path, method, body) {
  var opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  var res = await fetch('/api/' + path, opts);
  if (!res.ok) {
    var err = await res.json().catch(function() { return { error: res.statusText }; });
    throw new Error(err.error || res.statusText);
  }
  return res.json().catch(function() { return null; });
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

async function callClaude(sys, user, maxTok) {
  var d = await api('claude', 'POST', { model: 'claude-haiku-4-5-20251001', max_tokens: maxTok || 800, system: sys, messages: [{ role: 'user', content: user }] });
  if (d.error) throw new Error(d.error.message || d.error);
  var txt = (d.content || []).filter(function(b) { return b.type === 'text'; }).map(function(b) { return b.text; }).join('');
  txt = txt.replace(/```json|```/g, '').trim();
  try { return JSON.parse(txt); } catch(e) {
    var s = txt.indexOf('{'), en = txt.lastIndexOf('}');
    if (s !== -1 && en > s) { try { return JSON.parse(txt.slice(s, en + 1)); } catch(e2) {} }
    throw new Error('Parse error: ' + txt.slice(0, 100));
  }
}

// ── Notifications ──
var _tt;
function toast(msg, dur) { var el = document.getElementById('toast'); if (!el) return; el.textContent = msg; el.style.display = 'block'; clearTimeout(_tt); _tt = setTimeout(function() { el.style.display = 'none'; }, dur || 2500); }
var _si;
function showSaved() { var el = document.getElementById('save-ind'); if (!el) return; el.style.display = 'block'; clearTimeout(_si); _si = setTimeout(function() { el.style.display = 'none'; }, 2000); }
function flashCopied(text) {
  try { navigator.clipboard.writeText(text); } catch(e) {}
  var el = document.createElement('div'); el.className = 'copied-flash'; el.textContent = 'Copied: ' + text.slice(0, 35) + (text.length > 35 ? '...' : ''); document.body.appendChild(el); setTimeout(function() { el.remove(); }, 1600);
}

// ── HTML helpers ──
function h(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function hq(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function rb(r) { var x = REGIONS[r] || { label: r, cls: '' }; return '<span class="badge ' + x.cls + '">' + h(x.short || x.label) + '</span>'; }
function sb(st) { var x = STAGES[st] || { label: st, cls: '' }; return '<span class="badge ' + x.cls + '">' + h(x.label) + '</span>'; }
function pb(pr) { var x = PRIORITY[pr] || PRIORITY.low; return '<span class="dot ' + x.dot + '"></span>'; }

// ── Init ──
async function init() {
  S.loading = true; render();
  try {
    var results = await Promise.all([api('contacts'), api('matches')]);
    S.contacts = results[0] || [];
    S.matches = results[1] || [];
    S.loading = false;
    // Check for old localStorage data to migrate
    checkMigration();
    render();
  } catch(e) {
    S.loadError = e.message;
    S.loading = false;
    render();
  }
}

function checkMigration() {
  var oldC = localStorage.getItem('gw4-c') || localStorage.getItem('gw3-c') || localStorage.getItem('gwcrm2-c');
  if (oldC && S.contacts.length === 0) {
    try {
      var old = JSON.parse(oldC);
      if (old && old.length > 0) {
        if (confirm('Found ' + old.length + ' contacts from the old version. Import them to the cloud database?')) {
          importOldData(old);
        }
      }
    } catch(e) {}
  }
}

async function importOldData(contacts) {
  toast('Importing ' + contacts.length + ' contacts...', 5000);
  try {
    await api('contacts', 'POST', { action: 'import', contacts: contacts });
    var oldM = localStorage.getItem('gw4-m') || localStorage.getItem('gw3-m') || localStorage.getItem('gwcrm2-m');
    if (oldM) {
      var matches = JSON.parse(oldM);
      if (matches && matches.length) await api('matches', 'POST', { action: 'import', matches: matches });
    }
    S.contacts = await api('contacts');
    S.matches = await api('matches');
    render();
    toast('Import complete!');
  } catch(e) { toast('Import error: ' + e.message); }
}

// ── Render ──
function render() {
  if (S.loading) {
    document.getElementById('app').innerHTML = '<div class="loading-screen"><span class="spin spin-lg"></span><h2>Gateway CRM</h2><p style="font-size:12px;color:var(--text3)">Loading your contacts...</p></div>';
    return;
  }
  if (S.loadError) {
    document.getElementById('app').innerHTML = '<div class="loading-screen"><h2>Could not connect</h2><p style="font-size:12px;color:var(--text3);max-width:300px;text-align:center">'+h(S.loadError)+'<br><br>Check that your Vercel environment variables (SUPABASE_URL, SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY) are set correctly.</p><button class="btn btn-p" style="margin-top:16px" onclick="location.reload()">Retry</button></div>';
    return;
  }
  renderApp();
}

  document.getElementById('app').innerHTML = '<div class="app">'
    + '<div class="topbar">'
    + '<div class="logo">Gateway <em>CRM</em></div>'
    + '<div class="tabs">'
    + '<button class="tab ' + (S.tab === 'contacts' ? 'on' : '') + '" onclick="setTab(\'contacts\')">Contacts <span class="cnt">' + S.contacts.length + '</span></button>'

    + '</div>'
    + '<div class="sp"></div>'
    + '<button class="btn" onclick="openAdd()">+ Add</button>'
    + '<button class="btn btn-v" onclick="openSmartMatch()">&#10024; Smart Match</button>'
    + '<button class="btn btn-p" id="mbtn" onclick="startMatch()" ' + (S.matching ? 'disabled' : '') + '>' + (S.matching ? '<span class="spin"></span> Matching...' : 'Run Matchmaking') + '</button>'
    + '<div class="exp-drop" id="exp-drop">'
    + '<button class="btn btn-g" onclick="toggleExportMenu()">&#8595; Export</button>'
    + '<div class="exp-menu" id="exp-menu">'
    + '<div class="exp-label">Download</div>'
    + '<div class="exp-item" onclick="downloadExcel()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Download Excel (.xlsx)</div>'
    + '<div class="exp-item" onclick="downloadJSON()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Backup JSON</div>'
    + '<div class="exp-sep"></div>'
    + '<div class="exp-label">Import</div>'
    + '<div class="exp-item" onclick="triggerImport()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Restore from JSON</div>'
    + '<input type="file" id="import-file" accept=".json" style="display:none" onchange="restoreJSON(this)"/>'
    + '</div></div>'
    + '</div>'
    + '<div class="fbar" id="fbar"></div>'
    + '<div class="content" id="content"></div>'
    + '</div>'
    + '<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)"></div>';
  renderFilters();
  renderContent();
}

function count(r) { return S.contacts.filter(function(c) { return c.region === r; }).length; }

function renderFilters() {
  var fb = document.getElementById('fbar'); if (!fb) return;
  if (S.tab === 'contacts') {
    var rChips = ['all','china','mexico','north_america','others'].map(function(r) { var l = r === 'all' ? 'All' : REGIONS[r] ? REGIONS[r].label : r; return '<button class="chip ' + (S.filters.region === r ? 'on' : '') + '" onclick="setF(\'region\',\'' + r + '\')">' + l + '</button>'; }).join('');
    var stChips = ['all','exploring','active','ready'].map(function(s) { var l = s === 'all' ? 'All Stages' : STAGES[s].label; return '<button class="chip ' + (S.filters.stage === s ? 'on' : '') + '" onclick="setF(\'stage\',\'' + s + '\')">' + l + '</button>'; }).join('');
    var prChips = ['all','high','medium','low'].map(function(p) { var l = p === 'all' ? 'All Priority' : PRIORITY[p] ? PRIORITY[p].label : p; return '<button class="chip ' + (S.filters.priority === p ? 'on' : '') + '" onclick="setF(\'priority\',\'' + p + '\')">' + l + '</button>'; }).join('');
    var secOpts = SECTORS.map(function(s) { return '<option value="' + hq(s) + '" ' + (S.filters.sector === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
    fb.innerHTML = '<div class="srch"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 3 3"/></svg><input type="text" placeholder="Search name, company, WeChat, email..." value="' + hq(S.filters.q) + '" oninput="setF(\'q\',this.value)"/></div>'
      + '<div class="chips">' + rChips + '</div>'
      + '<select class="fsel" onchange="setF(\'sector\',this.value)"><option value="all" ' + (S.filters.sector === 'all' ? 'selected' : '') + '>All Sectors</option>' + secOpts + '</select>'
      + '<div class="chips">' + stChips + '</div>'
      + '<div class="chips">' + prChips + '</div>'
      + '<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="clearF()">Clear</button>';
  } else {
    fb.innerHTML = '<div class="chips">' + ['all','suggested','introduced','in_progress','closed'].map(function(s) { var l = s === 'all' ? 'All' : s === 'in_progress' ? 'In Progress' : s.charAt(0).toUpperCase() + s.slice(1); return '<button class="chip ' + (S.mFilter === s ? 'on' : '') + '" onclick="setMF(\'' + s + '\')">' + l + '</button>'; }).join('') + '</div>';
  }
}

function filteredC() {
  return S.contacts.filter(function(c) {
    var q = S.filters.q.toLowerCase();
    if (q && ![c.name, c.company, c.title, c.wechat, c.whatsapp, c.email, c.phone, c.description].join(' ').toLowerCase().includes(q)) return false;
    if (S.filters.region !== 'all' && c.region !== S.filters.region) return false;
    if (S.filters.sector !== 'all' && c.sector !== S.filters.sector) return false;
    if (S.filters.stage !== 'all' && c.stage !== S.filters.stage) return false;
    if (S.filters.priority !== 'all' && (c.priority || 'low') !== S.filters.priority) return false;
    return true;
  });
}

function renderContent() { var ct = document.getElementById('content'); if (!ct) return; if (S.tab === 'contacts') renderContacts(ct); else renderMatches(ct); }

function renderContacts(ct) {
  var cs = filteredC();
  var stats = '<div class="stats">'
    + '<div class="stat"><span class="sn">' + S.contacts.length + '</span><span class="sl">Total</span></div>'
    + '<div class="stat"><span class="sn" style="color:#1e40af">' + count('china') + '</span><span class="sl">China</span></div>'
    + '<div class="stat"><span class="sn" style="color:#14532d">' + count('mexico') + '</span><span class="sl">Mexico</span></div>'
    + '<div class="stat"><span class="sn" style="color:#78350f">' + count('north_america') + '</span><span class="sl">N. America</span></div>'
    + '<div class="stat"><span class="sn" style="color:#581c87">' + count('others') + '</span><span class="sl">Others</span></div>'
    + '<div class="stat"><span class="sn" style="color:#b91c1c">' + S.contacts.filter(function(c) { return c.priority === 'high'; }).length + '</span><span class="sl">High Priority</span></div>'
    + '</div>';
  if (!cs.length) { ct.innerHTML = stats + '<div class="tw"><div class="empty"><h3>' + (!S.contacts.length ? 'No contacts yet' : 'No results') + '</h3><p>' + (!S.contacts.length ? 'Click "+ Add" to get started.' : 'Try adjusting the filters.') + '</p></div></div>'; return; }
  var rows = cs.map(function(c) { return contactRow(c) + expandedRow(c); }).join('');
  ct.innerHTML = stats + '<div class="tw"><table><thead><tr>'
    + '<th style="width:16%">Name / Role / Company</th><th style="width:7%">Region</th>'
    + '<th style="width:8%">Sector</th><th style="width:7%">Stage</th>'
    + '<th style="width:18%">Contact Info</th><th style="width:22%">Description</th>'
    + '<th style="width:16%">Offers / Needs</th><th style="width:6%"></th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function contactRow(c) {
  var exp = S.expanded[c.id];
  var mCnt = S.matches.filter(function(m) { return m.idA === c.id || m.idB === c.id; }).length;
  var offers = (c.offers || []).slice(0, 2).map(function(o) { return '<span class="tag">' + h(o) + '</span>'; }).join('');
  var needs = (c.needs || []).slice(0, 2).map(function(n) { return '<span class="tag tag-n">' + h(n) + '</span>'; }).join('');
  return '<tr onclick="toggleExp(\'' + hq(c.id) + '\')">'
    + '<td><div class="nc">' + pb(c.priority || 'low') + ' <strong>' + h(c.name || '') + '</strong><div class="role">' + h(c.title || '') + '</div><div class="co">' + h(c.company || '') + '</div></div></td>'
    + '<td>' + rb(c.region) + '</td>'
    + '<td style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:85px">' + h(c.sector || '') + '</td>'
    + '<td>' + sb(c.stage) + '</td>'
    + '<td><div class="contact-icons">' + contactIcons(c) + '</div></td>'
    + '<td><div class="desc">' + h(c.description || '') + '</div></td>'
    + '<td><div class="tags">' + offers + needs + '</div></td>'
    + '<td style="white-space:nowrap">' + (mCnt ? '<span style="font-size:10px;color:var(--text3);margin-right:3px">' + mCnt + 'm</span>' : '')
    + '<button class="ibt" onclick="event.stopPropagation();editC(\'' + hq(c.id) + '\')" title="Edit">&#9998;</button>'
    + '<button class="ibt" onclick="event.stopPropagation();delC(\'' + hq(c.id) + '\')" title="Delete" style="color:var(--text3)">&#215;</button>'
    + '<span style="color:var(--text3);font-size:10px;margin-left:1px">' + (exp ? '&#9650;' : '&#9660;') + '</span></td>'
    + '</tr>';
}

function contactIcons(c) {
  var out = '';
  if (c.wechat) out += '<span class="cicon ci-wc" data-tip="' + hq(c.wechat) + '" onclick="event.stopPropagation();flashCopied(\'' + hq(c.wechat) + '\')">W</span>';
  if (c.whatsapp) out += '<span class="cicon ci-wa" data-tip="' + hq(c.whatsapp) + '" onclick="event.stopPropagation();flashCopied(\'' + hq(c.whatsapp) + '\')">WA</span>';
  if (c.email) out += '<span class="cicon ci-em" data-tip="' + hq(c.email) + '" onclick="event.stopPropagation();flashCopied(\'' + hq(c.email) + '\')">@</span>';
  if (c.phone) out += '<span class="cicon ci-ph" data-tip="' + hq(c.phone) + '" onclick="event.stopPropagation();flashCopied(\'' + hq(c.phone) + '\')">Tel</span>';
  if (c.linkedin) out += '<span class="cicon ci-li" data-tip="LinkedIn" onclick="event.stopPropagation();flashCopied(\'' + hq(c.linkedin) + '\')">Li</span>';
  if (c.otherContact) out += '<span class="cicon ci-ot" data-tip="' + hq(c.otherContact) + '" onclick="event.stopPropagation();flashCopied(\'' + hq(c.otherContact) + '\')">+</span>';
  return out || '<span style="font-size:10px;color:var(--text3)">—</span>';
}

function expandedRow(c) {
  if (!S.expanded[c.id]) return '<tr class="exp-row" id="exp-' + c.id + '" style="display:none"><td colspan="8"></td></tr>';
  var mCnt = S.matches.filter(function(m) { return m.idA === c.id || m.idB === c.id; }).length;
  function ecb(cls, label, val) { if (!val) return ''; return '<button class="ecb ' + cls + '" onclick="flashCopied(\'' + hq(val) + '\')">' + label + ': ' + h(val) + '</button>'; }
  var offers = (c.offers || []).map(function(o) { return '<span class="offer-tag">' + h(o) + '</span>'; }).join('');
  var needs = (c.needs || []).map(function(n) { return '<span class="need-tag">' + h(n) + '</span>'; }).join('');
  return '<tr class="exp-row" id="exp-' + hq(c.id) + '"><td colspan="8"><div class="exp-panel">'
    + (c.description ? '<div class="exp-desc">' + h(c.description) + '</div>' : '')
    + '<div class="exp-grid">'
    + '<div><h4>Contact Details</h4><div style="line-height:2">'
    + ecb('ecb-wc', 'WeChat', c.wechat) + ecb('ecb-wa', 'WhatsApp', c.whatsapp) + ecb('ecb-em', 'Email', c.email)
    + ecb('ecb-ph', 'Phone', c.phone) + ecb('ecb-li', 'LinkedIn', c.linkedin) + ecb('ecb-ot', 'Other', c.otherContact)
    + (c.website ? '<div style="font-size:11px;color:var(--text2);margin-top:3px">Web: <a href="' + hq(c.website) + '" target="_blank" style="color:var(--blue)">' + h(c.website) + '</a></div>' : '')
    + '</div></div>'
    + '<div><h4>Business Profile</h4>'
    + '<div class="exp-field"><span class="exp-label">Type</span><span class="exp-val">' + h(c.companyType || '—') + '</span></div>'
    + '<div class="exp-field"><span class="exp-label">Budget</span><span class="exp-val">' + h(c.budget || 'Unknown') + '</span></div>'
    + '<div class="exp-field"><span class="exp-label">Scale</span><span class="exp-val">' + h(c.scale || 'Unknown') + '</span></div>'
    + '<div class="exp-field"><span class="exp-label">Source</span><span class="exp-val">' + h(c.source || '—') + '</span></div>'
    + '<div class="exp-field"><span class="exp-label">Added</span><span class="exp-val">' + h(c.dateAdded || '—') + '</span></div>'
    + (mCnt ? '<div class="exp-field"><span class="exp-label">Matches</span><span class="exp-val"><button class="btn btn-ghost btn-sm" onclick="setTab(\'matches\')">' + mCnt + ' match' + (mCnt > 1 ? 'es' : '') + '</button></span></div>' : '')
    + '</div>'
    + '<div><h4>Offers &amp; Needs</h4>'
    + '<div style="margin-bottom:6px">' + (offers || '<span style="color:var(--text3);font-size:11px">—</span>') + '</div>'
    + '<div>' + (needs || '<span style="color:var(--text3);font-size:11px">—</span>') + '</div>'
    + '</div></div>'
    + '<div class="exp-actions"><button class="btn btn-sm" onclick="editC(\'' + hq(c.id) + '\')">Edit</button><button class="btn btn-sm" style="color:#b91c1c" onclick="delC(\'' + hq(c.id) + '\')">Delete</button></div>'
    + '</div></td></tr>';
}

function toggleExp(id) { S.expanded[id] = !S.expanded[id]; renderContent(); }

// ── Matches ──
function renderMatches(ct) {
  var ms = S.matches.filter(function(m) { return S.mFilter === 'all' || m.status === S.mFilter; }).sort(function(a, b) { return (b.score || 0) - (a.score || 0); });
  if (!S.matches.length) { ct.innerHTML = '<div class="tw"><div class="empty"><h3>No matches yet</h3><p>Use Smart Match for targeted matching, or Run Matchmaking for auto-discovery.</p></div></div>'; return; }
  if (!ms.length) { ct.innerHTML = '<div class="tw"><div class="empty"><h3>No matches</h3><p>Try a different filter.</p></div></div>'; return; }
  var rows = ms.map(function(m) { return matchRow(m) + matchExpanded(m); }).join('');
  ct.innerHTML = '<div class="tw"><table><thead><tr>'
    + '<th style="width:42px">Score</th><th style="width:22%">Contact A</th><th style="width:22%">Contact B</th>'
    + '<th style="width:27%">Why match</th><th style="width:10%">Status</th><th style="width:8%"></th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function matchRow(m) {
  var cA = S.contacts.find(function(c) { return c.id === m.idA; });
  var cB = S.contacts.find(function(c) { return c.id === m.idB; });
  if (!cA || !cB) return '';
  var sc = m.score >= 8 ? 'sc-hi' : 'sc-md';
  var stOpts = Object.keys(MATCH_ST).map(function(k) { return '<option value="' + k + '" ' + (m.status === k ? 'selected' : '') + '>' + MATCH_ST[k] + '</option>'; }).join('');
  function mp(c) {
    var ct = [c.wechat ? 'W:' + c.wechat : '', c.whatsapp ? 'WA:' + c.whatsapp : '', c.email || ''].filter(Boolean).slice(0, 1).join('');
    return '<div style="display:flex;flex-direction:column;gap:1px"><div style="font-weight:600;font-size:12px">' + rb(c.region) + ' ' + h(c.name || c.company || '') + '</div><div style="font-size:11px;color:var(--text2)">' + h(c.company || '') + (c.title ? ' &middot; ' + h(c.title) : '') + '</div>' + (ct ? '<div style="font-size:11px;color:var(--text3)">' + h(ct) + '</div>' : '') + (m.isSmartMatch ? '<span style="font-size:10px;background:#f5f3ff;color:#6d28d9;padding:1px 6px;border-radius:10px;display:inline-block;margin-top:2px">Smart</span>' : '') + '</div>';
  }
  return '<tr onclick="toggleMExp(\'' + hq(m.id) + '\')">'
    + '<td style="padding-left:12px"><div class="score ' + sc + '">' + m.score + '</div></td>'
    + '<td>' + mp(cA) + '</td><td>' + mp(cB) + '</td>'
    + '<td style="font-size:11px;color:var(--text2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:210px">' + h(m.reason || '') + '</td>'
    + '<td><select class="status-sel" onchange="event.stopPropagation();updMStatus(\'' + hq(m.id) + '\',this.value)">' + stOpts + '</select></td>'
    + '<td style="white-space:nowrap"><button class="ibt" onclick="event.stopPropagation();delM(\'' + hq(m.id) + '\')" title="Delete">&#215;</button><span style="color:var(--text3);font-size:10px;margin-left:2px">' + (S.mExpanded[m.id] ? '&#9650;' : '&#9660;') + '</span></td>'
    + '</tr>';
}

function matchExpanded(m) {
  if (!S.mExpanded[m.id]) return '<tr class="exp-row" id="mexp-' + m.id + '" style="display:none"><td colspan="6"></td></tr>';
  var cA = S.contacts.find(function(c) { return c.id === m.idA; });
  var cB = S.contacts.find(function(c) { return c.id === m.idB; });
  if (!cA || !cB) return '';
  function sideHtml(c) {
    var rg = REGIONS[c.region] || { label: c.region || '', cls: '', short: '' };
    function ctLine(label, val, color) { if (!val) return ''; return '<div style="display:flex;gap:4px;align-items:center;margin:2px 0"><span style="font-size:10px;color:var(--text3);width:52px;flex-shrink:0">' + label + '</span><button style="font-size:11px;padding:1px 6px;border-radius:3px;background:' + color + ';color:#fff;border:none;cursor:pointer;font-weight:500;word-break:break-all;text-align:left" onclick="flashCopied(\'' + hq(val) + '\')">' + h(val) + '</button></div>'; }
    return '<div class="mx-side"><h5><span class="badge ' + rg.cls + '" style="margin-right:4px">' + rg.short + '</span>' + h(c.name || '') + '</h5>'
      + '<div style="font-size:12px;font-weight:600;margin-bottom:1px">' + h(c.company || '') + '</div>'
      + (c.title ? '<div style="font-size:11px;color:var(--text2);margin-bottom:7px">' + h(c.title) + '</div>' : '')
      + ctLine('WeChat', c.wechat, '#07c160') + ctLine('WhatsApp', c.whatsapp, '#25d366')
      + ctLine('Email', c.email, '#3b82f6') + ctLine('Phone', c.phone, '#6366f1')
      + ctLine('LinkedIn', c.linkedin, '#0a66c2') + ctLine('Other', c.otherContact, '#64748b')
      + (c.budget && c.budget !== 'Unknown' ? '<div style="font-size:10px;color:var(--text3);margin-top:6px">Budget: ' + h(c.budget) + '</div>' : '')
      + (c.offers && c.offers.length ? '<div style="margin-top:7px;font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Offers</div><div>' + (c.offers || []).map(function(o) { return '<span class="offer-tag">' + h(o) + '</span>'; }).join('') + '</div>' : '')
      + (c.needs && c.needs.length ? '<div style="margin-top:5px;font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Needs</div><div>' + (c.needs || []).map(function(n) { return '<span class="need-tag">' + h(n) + '</span>'; }).join('') + '</div>' : '')
      + '</div>';
  }
  var intro = S.introText[m.id] || '';

    + '<div class="mx-grid">' + sideHtml(cA) + '<div class="mx-arrow">&#8594;</div>' + sideHtml(cB) + '</div>'

    + (intro ? '<div class="intro-box">' + h(intro) + '</div><button class="btn btn-sm" style="margin-top:6px" onclick="flashCopied(\'' + hq(intro) + '\')">Copy intro message</button>' : '')
    + '<div class="mx-actions" style="margin-top:10px">'

    + '<button class="btn btn-sm" onclick="delM(\'' + hq(m.id) + '\')">Remove</button>'
    + '</div></div></td></tr>';
}

function toggleMExp(id) { S.mExpanded[id] = !S.mExpanded[id]; renderContent(); }

async function genIntro(matchId) {
  var m = S.matches.find(function(x) { return x.id === matchId; }); if (!m) return;
  var cA = S.contacts.find(function(c) { return c.id === m.idA; });
  var cB = S.contacts.find(function(c) { return c.id === m.idB; });
  if (!cA || !cB) return;
  S.generatingIntro = matchId; renderContent();
  try {
    var sys = 'Write a short professional introduction message to introduce two business contacts. English + Chinese version if one is Chinese. 3-4 sentences max per version.';
    var user = 'A: ' + cA.name + ', ' + cA.title + ' at ' + cA.company + ' (' + cA.region + '). Offers: ' + (cA.offers || []).join(', ') + '. Needs: ' + (cA.needs || []).join(', ') + '.\nB: ' + cB.name + ', ' + cB.title + ' at ' + cB.company + ' (' + cB.region + '). Offers: ' + (cB.offers || []).join(', ') + '. Needs: ' + (cB.needs || []).join(', ') + '.\nReason: ' + m.reason + '\nA contact: ' + (cA.wechat || cA.whatsapp || cA.email || '') + '\nB contact: ' + (cB.wechat || cB.whatsapp || cB.email || '');
    var d = await callClaude(sys, user, 400);
    S.introText[matchId] = (d.content || []).filter(function(b) { return b.type === 'text'; }).map(function(b) { return b.text; }).join('').trim();
  } catch(e) {
    // callClaude parses JSON, but intro generation returns plain text
    // Re-call directly for plain text response
    try {
      var r = await api('claude', 'POST', { model: 'claude-haiku-4-5-20251001', max_tokens: 400, system: 'Write a short professional introduction message to introduce two business contacts. English + Chinese version if one is Chinese. 3-4 sentences max.', messages: [{ role: 'user', content: user }] });
      S.introText[matchId] = (r.content || []).filter(function(b) { return b.type === 'text'; }).map(function(b) { return b.text; }).join('').trim();
    } catch(e2) { toast('Error: ' + e2.message); }
  }
  S.generatingIntro = false; renderContent();
}

// ── Smart Match ──
function openSmartMatch() {
  var contactOpts = S.contacts.map(function(c) { return '<option value="' + hq(c.id) + '">' + h((c.name || c.company || '?') + ' — ' + (REGIONS[c.region] ? REGIONS[c.region].label : c.region) + ' — ' + (c.company || '')) + '</option>'; }).join('');

    + '<textarea id="sm-prompt" placeholder="Examples:&#10;• Find the best Mexico customs broker for Wang Wei who imports electronics&#10;• Match US distributors to Chinese auto parts factories with $500K+ budgets&#10;• Who can help Zhang Li set up a company in Mexico City?&#10;• Find contacts who can help with USMCA compliance&#10;• Connect Mexican industrial parks with Chinese EV manufacturers ready to move"></textarea></div>'

    + '</div></div>');
  setTimeout(function() { var ta = document.getElementById('sm-prompt'); if (ta) ta.focus(); }, 80);

async function runSmartMatch() {
  var prompt = (document.getElementById('sm-prompt') || {}).value || '';
  var anchorId = (document.getElementById('sm-anchor') || {}).value || '';
  if (!prompt.trim()) { toast('Describe what you\'re looking for first.'); return; }
  if (S.contacts.length < 2) { toast('Need at least 2 contacts to match.'); return; }
  var btn = document.getElementById('sm-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Thinking...'; }
  var res = document.getElementById('sm-results');
  if (res) res.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text2);font-size:12px"><span class="spin spin-d"></span> Analyzing your contacts...</div>';
  try {
    var anchor = anchorId ? S.contacts.find(function(c) { return c.id === anchorId; }) : null;
    var slim = S.contacts.map(function(c) { return { id: c.id, name: c.name, title: c.title, company: c.company, companyType: c.companyType, region: c.region, sector: c.sector, offers: c.offers, needs: c.needs, stage: c.stage, priority: c.priority, budget: c.budget, description: c.description }; });
    var userMsg = 'User request: "' + prompt + '"';
    if (anchor) userMsg += '\n\nAnchor (find matches FOR): ' + JSON.stringify({ id: anchor.id, name: anchor.name, company: anchor.company, region: anchor.region, sector: anchor.sector, offers: anchor.offers, needs: anchor.needs });
    userMsg += '\n\nAll contacts:\n' + JSON.stringify(slim);
    var r = await callClaude(SMART_SYS, userMsg, 1000);
    var newMatches = (r.matches || []).map(function(m) { return Object.assign({}, m, { id: uid(), status: 'suggested', date: new Date().toISOString().slice(0, 10), isSmartMatch: true, smartPrompt: prompt }); });
    if (!newMatches.length) { if (res) res.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text2);font-size:12px">No strong matches found. Try rephrasing your request.</div>'; }
    else {
      var cards = newMatches.map(function(m, i) {
        var cA = S.contacts.find(function(c) { return c.id === m.idA; });
        var cB = S.contacts.find(function(c) { return c.id === m.idB; });
        if (!cA || !cB) return '';
        var sc = m.score >= 8 ? 'sc-hi' : 'sc-md';
        return '<div class="sm-result-card"><div class="smr-top"><div><div class="smr-names">' + rb(cA.region) + ' ' + h(cA.name || cA.company || '') + ' &nbsp;&#8594;&nbsp; ' + rb(cB.region) + ' ' + h(cB.name || cB.company || '') + '</div><div class="smr-cos">' + h(cA.company || '') + (cA.company && cB.company ? ' &middot; ' : '') + h(cB.company || '') + '</div></div><div class="score ' + sc + '">' + m.score + '</div></div><div class="smr-reason">' + h(m.reason || '') + '</div><div style="margin-top:8px"><input type="checkbox" id="smr-' + i + '" checked style="margin-right:4px"><label for="smr-' + i + '" style="font-size:11px;color:var(--text2)">Save to matches</label></div></div>';
      }).join('');
      S.smartResults = newMatches;
      if (res) res.innerHTML = '<p style="font-size:12px;color:var(--text2);margin-bottom:10px">Found <strong>' + newMatches.length + '</strong> match' + (newMatches.length !== 1 ? 'es' : '') + ':</p>' + cards + '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)"><button class="btn btn-p" onclick="saveSmartMatches()">Save Selected Matches</button><button class="btn" onclick="closeModal()">Cancel</button></div>';
    }
  } catch(e) { if (res) res.innerHTML = '<div style="color:#b91c1c;font-size:12px;padding:10px">Error: ' + h(e.message) + '</div>'; }
  if (btn) { btn.disabled = false; btn.innerHTML = '&#10024; Find Matches'; }
}

async function saveSmartMatches() {
  var newMatches = S.smartResults || [];
  var toSave = newMatches.filter(function(m, i) { var cb = document.getElementById('smr-' + i); return cb && cb.checked; });
  var existing = new Set(S.matches.map(function(m) { return m.idA + '__' + m.idB; }));
  toSave = toSave.filter(function(m) { return !existing.has(m.idA + '__' + m.idB); });
  if (!toSave.length) { toast('No new matches to save.'); return; }
  try {
    await api('matches', 'POST', { action: 'upsert', matches: toSave });
    S.matches = S.matches.concat(toSave);
    closeModal(); toast(toSave.length + ' match' + (toSave.length !== 1 ? 'es' : '') + ' saved!');
    S.tab = 'matches'; renderApp();
  } catch(e) { toast('Save error: ' + e.message); }
}

async function startMatch() {
  if (S.matching) return;
  if (S.contacts.length < 2) { toast('Need at least 2 contacts to match.'); return; }
  S.matching = true; renderApp();
  try {
    var slim = S.contacts.map(function(c) { return { id: c.id, name: c.name, company: c.company, title: c.title, region: c.region, sector: c.sector, companyType: c.companyType, offers: c.offers, needs: c.needs, stage: c.stage, priority: c.priority, budget: c.budget }; });
    var r = await callClaude(MATCH_SYS, 'All contacts:\n' + JSON.stringify(slim), 1400);
    var ex = new Set(S.matches.map(function(m) { return m.idA + '__' + m.idB; }));
    var newM = (r.matches || []).filter(function(m) { return !ex.has(m.idA + '__' + m.idB); }).map(function(m) { return Object.assign({}, m, { id: uid(), status: 'suggested', date: new Date().toISOString().slice(0, 10) }); });
    if (newM.length) {
      await api('matches', 'POST', { action: 'upsert', matches: newM });
      S.matches = S.matches.concat(newM);
      toast(newM.length + ' new match' + (newM.length !== 1 ? 'es' : '') + ' found!');
      S.tab = 'matches';
    } else { toast('No new matches found.'); }
  } catch(e) { toast('Error: ' + e.message); }
  S.matching = false; renderApp();
}

function refreshAddContent() { var mc = document.getElementById('mcontent'); if (mc) mc.innerHTML = addInner(); setTimeout(function() { var ta = document.getElementById('pta'); if (ta && S.parseRaw) ta.value = S.parseRaw; }, 30); }

async function doExtract() {
  var text = (document.getElementById('pta') || {}).value || S.parseRaw; text = text.trim();
  if (!text) { toast('Paste some text first.'); return; }
  var btn = document.getElementById('ext-btn');

}

async function confirmAdd() {
  if (!S.parsed || !S.parsed.length) return;
  var toAdd = S.parsed.map(function(c) { return Object.assign({}, c, { id: uid(), dateAdded: new Date().toISOString().slice(0, 10) }); });
  // Optimistic update
  S.contacts = S.contacts.concat(toAdd);
  closeModal(); renderApp();
  try {
    for (var i = 0; i < toAdd.length; i++) {
      await api('contacts', 'POST', { action: 'upsert', contact: toAdd[i] });
    }
    showSaved(); toast(toAdd.length + ' contact' + (toAdd.length !== 1 ? 's' : '') + ' saved.');
  } catch(e) {
    var ids = new Set(toAdd.map(function(c) { return c.id; }));
    S.contacts = S.contacts.filter(function(c) { return !ids.has(c.id); });
    toast('Save failed: ' + e.message); renderApp();
  }
}

function editC(id) {
  var c = S.contacts.find(function(x) { return x.id === id; }); if (!c) return; S.editing = c;
  var secOpts = SECTORS.map(function(s) { return '<option value="' + hq(s) + '" ' + (c.sector === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
  var ctOpts = CTYPES.map(function(s) { return '<option value="' + hq(s) + '" ' + (c.companyType === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
  var srcOpts = SOURCES.map(function(s) { return '<option value="' + hq(s) + '" ' + (c.source === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
  var budOpts = BUDGETS.map(function(s) { return '<option value="' + hq(s) + '" ' + (c.budget === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
  var scaOpts = SCALES.map(function(s) { return '<option value="' + hq(s) + '" ' + (c.scale === s ? 'selected' : '') + '>' + h(s) + '</option>'; }).join('');
  showModal('<div class="modal" onclick="event.stopPropagation()"><div class="mhd"><h2>Edit: ' + h(c.name || c.company || '') + '</h2><button class="ibt" onclick="closeModal()" style="font-size:17px">&#215;</button></div><div class="mbody">'
    + '<div class="fsec">Identity</div>'
    + '<div class="frow"><div class="fg"><label class="fl">Name</label><input class="fi" id="en" value="' + hq(c.name || '') + '"/></div><div class="fg"><label class="fl">Title</label><input class="fi" id="et" value="' + hq(c.title || '') + '"/></div></div>'
    + '<div class="frow"><div class="fg"><label class="fl">Company</label><input class="fi" id="ec" value="' + hq(c.company || '') + '"/></div><div class="fg"><label class="fl">Type</label><select class="fs" id="ect"><option value="">Select...</option>' + ctOpts + '</select></div><div class="fg"><label class="fl">Website</label><input class="fi" id="ew" value="' + hq(c.website || '') + '"/></div></div>'
    + '<div class="fsec">Classification</div>'
    + '<div class="frow"><div class="fg"><label class="fl">Region</label><select class="fs" id="er"><option value="china" ' + (c.region === 'china' ? 'selected' : '') + '>China</option><option value="mexico" ' + (c.region === 'mexico' ? 'selected' : '') + '>Mexico</option><option value="north_america" ' + (c.region === 'north_america' ? 'selected' : '') + '>N. America</option><option value="others" ' + (c.region === 'others' ? 'selected' : '') + '>Others</option></select></div><div class="fg"><label class="fl">Sector</label><select class="fs" id="es"><option value="">Select...</option>' + secOpts + '</select></div><div class="fg"><label class="fl">Stage</label><select class="fs" id="est"><option value="exploring" ' + (c.stage === 'exploring' ? 'selected' : '') + '>Exploring</option><option value="active" ' + (c.stage === 'active' ? 'selected' : '') + '>Active</option><option value="ready" ' + (c.stage === 'ready' ? 'selected' : '') + '>Ready</option></select></div><div class="fg"><label class="fl">Priority</label><select class="fs" id="epr"><option value="low" ' + (c.priority === 'low' ? 'selected' : '') + '>Low</option><option value="medium" ' + (c.priority === 'medium' ? 'selected' : '') + '>Medium</option><option value="high" ' + (c.priority === 'high' ? 'selected' : '') + '>High</option></select></div></div>'
    + '<div class="frow"><div class="fg"><label class="fl">Budget</label><select class="fs" id="ebu"><option value="">Unknown</option>' + budOpts + '</select></div><div class="fg"><label class="fl">Scale</label><select class="fs" id="esc"><option value="">Unknown</option>' + scaOpts + '</select></div><div class="fg"><label class="fl">Source</label><select class="fs" id="esrc"><option value="">Select...</option>' + srcOpts + '</select></div></div>'
    + '<div class="fsec">Contact Info</div>'
    + '<div class="frow"><div class="fg"><label class="fl">WeChat</label><input class="fi" id="ewc" value="' + hq(c.wechat || '') + '"/></div><div class="fg"><label class="fl">WhatsApp</label><input class="fi" id="ewa" value="' + hq(c.whatsapp || '') + '"/></div></div>'
    + '<div class="frow"><div class="fg"><label class="fl">Email</label><input class="fi" id="eem" value="' + hq(c.email || '') + '"/></div><div class="fg"><label class="fl">Phone</label><input class="fi" id="eph" value="' + hq(c.phone || '') + '"/></div></div>'
    + '<div class="frow"><div class="fg"><label class="fl">LinkedIn</label><input class="fi" id="eli" value="' + hq(c.linkedin || '') + '"/></div><div class="fg"><label class="fl">Other</label><input class="fi" id="eot" value="' + hq(c.otherContact || '') + '"/></div></div>'
    + '<div class="fsec">Business Details</div>'
    + '<div class="fg"><label class="fl">Description</label><textarea class="fta" id="ed" style="min-height:55px">' + h(c.description || '') + '</textarea></div>'
    + '<div class="frow"><div class="fg"><label class="fl">Offers</label><input class="fi" id="eof" value="' + hq((c.offers || []).join(', ')) + '"/></div><div class="fg"><label class="fl">Needs</label><input class="fi" id="end2" value="' + hq((c.needs || []).join(', ')) + '"/></div></div>'
    + '</div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveEdit()">Save Changes</button></div></div>');
}

async function saveEdit() {
  var c = S.editing; if (!c) return;
  var parse = function(s) { return (s || '').split(',').map(function(x) { return x.trim(); }).filter(Boolean); };
  function v(id) { return (document.getElementById(id) || {}).value || ''; }
  var orig = Object.assign({}, c);
  Object.assign(c, { name: v('en'), title: v('et'), company: v('ec'), companyType: v('ect'), website: v('ew'), region: v('er'), sector: v('es'), stage: v('est'), priority: v('epr'), budget: v('ebu'), scale: v('esc'), source: v('esrc'), wechat: v('ewc'), whatsapp: v('ewa'), email: v('eem'), phone: v('eph'), linkedin: v('eli'), otherContact: v('eot'), description: v('ed'), offers: parse(v('eof')), needs: parse(v('end2')) });
  closeModal(); renderApp();
  try { await api('contacts', 'POST', { action: 'upsert', contact: c }); showSaved(); }
  catch(e) { Object.assign(c, orig); toast('Save failed: ' + e.message); renderApp(); }
}

// ── Delete ──
async function delC(id) {
  if (!confirm('Delete this contact and their matches?')) return;
  var prev = S.contacts.slice(); var prevM = S.matches.slice();
  S.contacts = S.contacts.filter(function(c) { return c.id !== id; });
  S.matches = S.matches.filter(function(m) { return m.idA !== id && m.idB !== id; });
  delete S.expanded[id]; renderApp();
  try { await api('contacts', 'POST', { action: 'delete', id }); showSaved(); }
  catch(e) { S.contacts = prev; S.matches = prevM; toast('Delete failed: ' + e.message); renderApp(); }
}

async function delM(id) {
  var prev = S.matches.slice();
  S.matches = S.matches.filter(function(m) { return m.id !== id; });
  delete S.mExpanded[id]; renderContent();
  try { await api('matches', 'POST', { action: 'delete', id }); showSaved(); }
  catch(e) { S.matches = prev; toast('Delete failed: ' + e.message); renderContent(); }
}

async function updMStatus(id, status) {
  var m = S.matches.find(function(x) { return x.id === id; }); if (!m) return;
  var prev = m.status; m.status = status;
  try { await api('matches', 'POST', { action: 'update_status', id, status }); showSaved(); }
  catch(e) { m.status = prev; toast('Update failed: ' + e.message); }
}

// ── Export ──
function toggleExportMenu() {
  S.exportOpen = !S.exportOpen;
  var m = document.getElementById('exp-menu'); if (m) m.className = 'exp-menu' + (S.exportOpen ? ' open' : '');
}
document.addEventListener('click', function(e) {
  var drop = document.getElementById('exp-drop');
  if (drop && !drop.contains(e.target)) { S.exportOpen = false; var m = document.getElementById('exp-menu'); if (m) m.className = 'exp-menu'; }
});

async function downloadExcel() {
  S.exportOpen = false; var m = document.getElementById('exp-menu'); if (m) m.className = 'exp-menu';
  toast('Generating Excel...', 4000);
  try {
    var res = await fetch('/api/export');
    if (!res.ok) throw new Error('Export failed');
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'gateway-crm-' + new Date().toISOString().slice(0, 10) + '.xlsx';
    a.click(); URL.revokeObjectURL(url);
    toast('Excel downloaded.');
  } catch(e) { toast('Export error: ' + e.message); }
}

function downloadJSON() {
  S.exportOpen = false; var m = document.getElementById('exp-menu'); if (m) m.className = 'exp-menu';
  var data = { version: 3, exportedAt: new Date().toISOString(), contacts: S.contacts, matches: S.matches };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = 'gateway-crm-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  URL.revokeObjectURL(url); toast('JSON backup downloaded.');
}

function triggerImport() { S.exportOpen = false; document.getElementById('import-file').click(); }

async function restoreJSON(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = async function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var contacts = data.contacts || []; var matches = data.matches || [];
      if (!confirm('Import ' + contacts.length + ' contacts and ' + matches.length + ' matches? (Merges with existing data)')) return;
      toast('Importing...', 5000);
      await api('contacts', 'POST', { action: 'import', contacts });
      await api('matches', 'POST', { action: 'import', matches });
      var results = await Promise.all([api('contacts'), api('matches')]);
      S.contacts = results[0] || []; S.matches = results[1] || [];
      renderApp(); toast('Import complete!');
    } catch(err) { toast('Error: ' + err.message); }
  };
  reader.readAsText(file); input.value = '';
}

// ── Helpers ──
function setTab(t) { S.tab = t; S.expanded = {}; S.mExpanded = {}; renderApp(); }
function setF(k, v) { S.filters[k] = v; renderFilters(); renderContent(); }
function setMF(v) { S.mFilter = v; renderFilters(); renderContent(); }
function clearF() { S.filters = { q: '', region: 'all', sector: 'all', stage: 'all', priority: 'all' }; renderFilters(); renderContent(); }
function showModal(html) { var ov = document.getElementById('overlay'); if (!ov) return; ov.innerHTML = html; ov.style.display = 'flex'; }
function closeModal() { var ov = document.getElementById('overlay'); if (ov) { ov.style.display = 'none'; ov.innerHTML = ''; } S.editing = null; S.parsed = null; }
function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { var ta = document.getElementById('pta'); if (ta && document.activeElement === ta) doExtract(); }
  if (e.key === 'Escape') closeModal();
});

init();
</script>
