<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynerSage CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f9fafb;--bg3:#f3f4f6;--bg4:#e9ecef;
  --border:#e5e7eb;--border2:#d1d5db;
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;--text4:#d1d5db;
  --blue:#2563eb;--blue2:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --green:#15803d;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --purple:#7c3aed;--purple-bg:#f5f3ff;--purple-border:#ddd6fe;
  --top:#0b1d0e;--top-text:#f0f5f1;--top-border:#1a3320;--brand-green:#5caa72;--brand-coral:#c8583a;
  --r:6px;--r2:10px;--r3:14px;
  --sh:0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -1px rgba(0,0,0,.05);
  --sh3:0 10px 25px -5px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Auth screen ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1d0e;background-image:radial-gradient(ellipse at 40% 30%,#0e2a13 0%,#060f07 80%)}
.auth-card{width:400px;padding:48px 44px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:12px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.auth-logo{font-family:Georgia,'Times New Roman',serif;font-size:36px;font-weight:700;letter-spacing:.02em;color:#f0f5f1;margin-bottom:8px;display:block;line-height:1}.auth-logo em{color:#5caa72;font-style:normal}
.auth-tagline{color:#4a6b52;font-size:12px;margin-bottom:36px;margin-top:10px;line-height:1.55;letter-spacing:.01em}
.auth-label{display:block;font-size:10px;font-weight:700;color:#4a6b52;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.auth-input{width:100%;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:var(--r);font-size:14px;color:#f0f5f1;outline:none;font-family:inherit}
.auth-input:focus{border-color:#5caa72;background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(92,170,114,.12)}
.auth-input::placeholder{color:#2e4a35}
.auth-btn{width:100%;margin-top:22px;padding:12px;background:#c8583a;color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-family:inherit;transition:background .15s}
.auth-btn:hover{background:#b54d31}
.auth-error{margin-top:12px;color:#f87171;font-size:12px;text-align:center;min-height:18px}

/* ── App shell ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:#0b1d0e;border-bottom:1px solid #1a3320;padding:0 20px;display:flex;align-items:center;height:52px;gap:12px;flex-shrink:0}
.brand{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;letter-spacing:.02em;color:#f0f5f1;padding-bottom:3px;border-bottom:1.5px solid rgba(92,170,114,.35);white-space:nowrap;cursor:default;user-select:none}.brand em{color:#5caa72;font-style:normal}
.topbar-sep{width:1px;height:20px;background:var(--top-border);flex-shrink:0}
.tabs{display:flex;height:100%;gap:0}
.tab{padding:0 14px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;height:100%;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.01em;transition:color .15s}
.tab.on{color:#f0f5f1;border-bottom-color:#5caa72}
.tab:hover:not(.on){color:#94a3b8}
.cnt{font-size:10px;font-weight:700;background:rgba(255,255,255,.1);color:#94a3b8;padding:1px 6px;border-radius:20px}
.tab.on .cnt{background:rgba(92,170,114,.25);color:#5caa72}
.sp{flex:1}

/* ── Top buttons ── */
.tbtn{padding:6px 13px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;letter-spacing:.01em;border:1px solid transparent;transition:all .15s;font-family:inherit}
.tbtn-outline{background:transparent;border-color:rgba(255,255,255,.12);color:#94a3b8}
.tbtn-outline:hover{border-color:rgba(255,255,255,.25);color:var(--top-text)}
.tbtn-white{background:#f0f5f1;color:#0b1d0e;border-color:#f0f5f1}
.tbtn-white:hover{background:#fff}
.tbtn-purple{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tbtn-purple:hover{background:#6d28d9}
.tbtn-green{background:#059669;color:#fff;border-color:#059669}
.tbtn-green:hover{background:#047857}
.tbtn:disabled{opacity:.4;cursor:not-allowed}

/* ── Content buttons ── */
.btn{padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.btn:hover{background:var(--bg3)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}.btn-primary:hover{background:#374151}
.btn-danger{color:var(--red);border-color:var(--red-border)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.ibt{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:var(--r);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ibt:hover{color:var(--text);background:var(--bg3)}

/* ── Export dropdown ── */
.drop{position:relative;display:inline-flex}
.drop-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh3);z-index:200;min-width:210px;padding:5px 0;display:none}
.drop-menu.open{display:block}
.drop-item{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;cursor:pointer;color:var(--text);font-weight:500}
.drop-item:hover{background:var(--bg2)}
.drop-item svg{color:var(--text3);flex-shrink:0;width:13px;height:13px}
.drop-sep{height:1px;background:var(--border);margin:4px 0}
.drop-label{padding:7px 14px 4px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}

/* ── Filter bar ── */
.fbar{background:var(--bg);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.srch{position:relative;display:flex;align-items:center}
.srch-icon{position:absolute;left:9px;color:var(--text3);pointer-events:none;width:13px;height:13px}
.srch input{padding:6px 10px 6px 30px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg2);color:var(--text);outline:none;width:210px;font-family:inherit}
.srch input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.fsel{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;outline:none;font-family:inherit}
.fsel:focus{border-color:var(--blue)}
.chips{display:flex;gap:4px}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);letter-spacing:.01em;transition:all .12s}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip:hover:not(.on){background:var(--bg3);border-color:var(--border2)}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:16px 20px}

/* ── Stats row ── */
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:10px 16px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--sh)}
.sn{font-size:20px;font-weight:700;letter-spacing:-.03em}
.sl{font-size:11px;color:var(--text2);font-weight:500}

/* ── Table ── */
.tw{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg2);padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12px}
tbody tr:not(.exp-row){cursor:pointer}
tbody tr:not(.exp-row):hover td{background:#fafbfc}
tr:last-child td{border-bottom:none}
.exp-row td{padding:0;border-bottom:1px solid var(--border2)}
.exp-row:last-child td{border-bottom:none}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.b-cn{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.b-mx{background:#dcfce7;color:#14532d;border-color:#bbf7d0}
.b-na{background:#fef3c7;color:#78350f;border-color:#fde68a}
.b-ot{background:#f3e8ff;color:#581c87;border-color:#ddd6fe}
.b-exploring{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.b-active{background:var(--blue-bg);color:var(--blue2);border-color:var(--blue-border)}
.b-ready{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.b-smart{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-h{background:#ef4444}.dot-m{background:#f59e0b}.dot-l{background:#d1d5db}

/* ── Name cell ── */
.nc strong{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;color:var(--text)}
.nc .role{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;margin-top:1px}
.nc .co{font-size:11px;color:var(--blue2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}

/* ── Tags ── */
.tags{display:flex;flex-wrap:wrap;gap:3px;max-width:190px}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;background:var(--bg3);color:var(--text2);max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tag-n{background:var(--blue-bg);color:var(--blue2)}
.desc-cell{font-size:11px;color:var(--text2);line-height:1.5;max-width:220px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── Contact icons ── */
.ci-row{display:flex;gap:3px;flex-wrap:wrap}
.ci{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid transparent;white-space:nowrap;position:relative;letter-spacing:.02em}
.ci:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:4px 8px;border-radius:5px;font-size:10px;white-space:nowrap;pointer-events:none;z-index:60;font-weight:500;box-shadow:var(--sh2)}
.ci-wc{background:#e6f9f1;color:#07c160;border-color:#a7f3d0}
.ci-wa{background:#e9f7ee;color:#128c7e;border-color:#86efac}
.ci-em{background:var(--blue-bg);color:var(--blue2);border-color:var(--blue-border)}
.ci-ph{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.ci-li{background:#e8f0f9;color:#0a66c2;border-color:#93c5fd}
.ci-ot{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.copied-flash{position:fixed;top:20px;right:20px;background:#1e293b;color:#f1f5f9;padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:999;pointer-events:none;box-shadow:var(--sh2)}

/* ── Expanded row ── */
.exp-panel{padding:16px 18px;background:#fafbfc;border-left:3px solid var(--blue)}
.exp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px}
.exp-col-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:9px}
.exp-field{display:flex;gap:8px;align-items:flex-start;margin-bottom:5px}
.exp-lbl{color:var(--text3);width:68px;flex-shrink:0;font-size:11px;padding-top:1px;font-weight:500}
.exp-val{color:var(--text);word-break:break-word;font-size:12px;font-weight:500}
.ecb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;border:1px solid;margin:2px 2px 2px 0;transition:all .1s}
.ecb:hover{filter:brightness(.95)}
.ecb-wc{background:#e6f9f1;color:#07c160;border-color:#a7f3d0}
.ecb-wa{background:#e9f7ee;color:#128c7e;border-color:#86efac}
.ecb-em{background:var(--blue-bg);color:var(--blue2);border-color:var(--blue-border)}
.ecb-ph{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.ecb-li{background:#e8f0f9;color:#0a66c2;border-color:#93c5fd}
.ecb-ot{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.exp-desc{font-size:12px;color:var(--text2);line-height:1.6;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px}
.exp-actions{display:flex;gap:7px;padding-top:10px;border-top:1px solid var(--border)}
.offer-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px 2px 2px 0;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);font-weight:500}
.need-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px 2px 2px 0;background:var(--blue-bg);color:var(--blue2);border:1px solid var(--blue-border);font-weight:500}

/* ── Score ── */
.score{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.sc-hi{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.sc-md{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border)}

/* ── Match expanded ── */
.mx-panel{padding:18px;background:#fafbff;border-left:3px solid var(--blue)}
.mx-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:12px;margin-bottom:14px;align-items:start}
.mx-side{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh)}
.mx-side h5{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:9px}
.mx-arrow{display:flex;align-items:center;justify-content:center;padding-top:32px;color:var(--text3);font-size:22px}
.mx-reason{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:12px}
.mx-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.intro-box{margin-top:12px;padding:12px 14px;background:#f0f7ff;border:1px solid var(--blue-border);border-radius:var(--r);font-size:12px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word}
.status-sel{font-size:11px;font-weight:600;padding:4px 8px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit}

/* ── Smart match ── */
.sm-box{background:linear-gradient(135deg,#f5f3ff,#eff6ff);border:1px solid var(--purple-border);border-radius:var(--r2);padding:16px;margin-bottom:16px}
.sm-box label{font-size:11px;font-weight:700;color:var(--purple);display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.sm-box textarea{width:100%;padding:10px 12px;border:1px solid #c4b5fd;border-radius:var(--r);font-size:13px;background:#fff;color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:90px;line-height:1.55}
.sm-box textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.08)}
.sm-card{border:1px solid var(--border);border-radius:var(--r2);padding:13px;margin-bottom:8px;border-left:3px solid var(--purple);background:#fdfcff;box-shadow:var(--sh)}
.sm-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.sm-card-names{font-size:13px;font-weight:600}
.sm-card-cos{font-size:11px;color:var(--text2);margin-top:2px}
.sm-card-reason{font-size:12px;color:var(--text2);line-height:1.5}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--r3);width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.18);margin:auto;border:1px solid var(--border)}
.modal-lg{width:740px}
.mhd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.mhd h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mhd .sub{font-size:11px;color:var(--text2);margin-top:2px}
.mbody{padding:18px 22px}
.mfoot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ── Form ── */
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.02em}
.fi,.fs,.fta{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:#fff;color:var(--text);font-family:inherit;outline:none;transition:border-color .1s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.fta{resize:vertical;line-height:1.55}
.frow{display:flex;gap:12px}.frow .fg{flex:1}
.fsec{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:12px 0 7px;border-top:1px solid var(--border);margin-top:6px}


/* Strategy box */
.strategy-box{background:#fffbf0;border:1px solid #fde68a;border-radius:var(--r2);padding:14px 16px;margin-top:12px}
.strategy-box h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#92400e;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.strategy-section{margin-bottom:10px}
.strategy-section-title{font-size:10px;font-weight:700;color:#78350f;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.strategy-section-body{font-size:12px;color:var(--text);line-height:1.6}
.strategy-action{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(253,230,138,.4)}
.strategy-action:last-child{border-bottom:none}
.strategy-action-num{width:18px;height:18px;border-radius:50%;background:#f59e0b;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.strategy-fee{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#f59e0b;color:#fff;margin:2px 2px 0 0}

/* ── Upload zone ── */
.upload-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.utab{flex:1;padding:8px;border:none;background:var(--bg3);cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);text-align:center;font-family:inherit;transition:all .1s}
.utab.on{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.utab:hover:not(.on){background:var(--bg4)}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:var(--blue-bg)}
.drop-zone h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.drop-zone p{font-size:11px;color:var(--text2)}
.file-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;font-size:12px}
.file-preview .fn{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview .fs2{color:var(--text2)}

/* ── Parsed preview card ── */
.pc{border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.pc-name strong{font-size:14px;font-weight:600}
.pc-ctrls{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.pc-ctrls select{font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:var(--text);font-family:inherit;font-weight:600}
.pc-desc{font-size:11px;color:var(--text2);line-height:1.5;padding:7px 9px;background:var(--bg2);border-radius:var(--r);margin:6px 0}
.pc-contacts{font-size:11px;color:var(--text2);margin-bottom:5px}

/* ── Loading ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;background:#0b1d0e}
.loading-brand{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;letter-spacing:.02em;color:#f0f5f1;padding-bottom:5px;border-bottom:1.5px solid rgba(92,170,114,.35)}
.loading-sub{font-size:12px;color:#4a6b52}
.empty{text-align:center;padding:56px 20px;color:var(--text2)}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{font-size:12px;line-height:1.55}

/* ── Toast / save indicator ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1e293b;color:#f1f5f9;padding:9px 16px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:300;box-shadow:var(--sh3);display:none}
.save-ind{position:fixed;bottom:22px;left:22px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);padding:7px 13px;border-radius:var(--r);font-size:11px;font-weight:600;z-index:300;display:none;align-items:center;gap:5px}

/* ── Spinner ── */
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .55s linear infinite;vertical-align:middle}
.spin-lg{width:22px;height:22px;border-width:2.5px;border-color:rgba(59,130,246,.2);border-top-color:var(--blue)}
.spin-d{border-color:rgba(100,100,100,.15);border-top-color:var(--text2)}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text3);font-size:11px;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.tip{font-size:10px;color:var(--text3);margin-top:4px}
</style>

<script>

// ── Constants ──

var RELATIONSHIPS=['New contact','In conversation','Active relationship','Strategic partner','Closed / Inactive'];

var SCALES=['Unknown','Solo / Freelancer','Startup (< 20)','SME (20-200)','Mid-size (200-2000)','Large (2000+)'];
var SOURCES=[
  '— Chinese Platforms —','Douyin','Xiaohongshu (RED)','WeChat','WeChat Group','Weibo','Bilibili','Zhihu',
  '— International Platforms —','LinkedIn','Twitter / X','Instagram','Facebook','TikTok','YouTube','WhatsApp Group','Telegram','Reddit',

var PARSE_SYS=`Extract ALL business contacts. Return ONLY valid JSON. SKIP anyone named Yang Xiang, 向阳, or Yang.

Schema: {"contacts":[{
  "name":"","title":"job title/role","company":"","companyType":"Manufacturer|Distributor|Importer|Exporter|Service Provider|Investor|Platform|Brand|Consultant|Media|Agency|Other",

  "source":"Douyin|Xiaohongshu (RED)|WeChat|WeChat Group|Weibo|Bilibili|Zhihu|LinkedIn|Twitter/X|Instagram|Facebook|TikTok|YouTube|WhatsApp Group|Telegram|Reddit|Referral|Event/Conference|Cold Outreach|Other",
  "description":"2-3 sentence summary: who they are, what they do, what they want"
}]}

Extract ALL contacts. Infer intent, relationship stage, and language from context. Be thorough with contact details.`;

var MATCH_SYS=`Expert business matchmaker for cross-border trade (China, Mexico, N. America, others). Match ALL contacts — any direction works. Return ONLY JSON.
{"matches":[{"idA":"exact_id_from_contact_data","idB":"exact_id_from_contact_data","score":8,"reason":"2-3 sentences: specific value this connection creates"}]}
CRITICAL: idA and idB must be the EXACT id values from the contact data. Do not modify or generate new IDs.
Score 1-10 (only 6+). Max 20. Sort by score descending. Consider: complementary offers/needs, sector fit, stage compatibility, budget alignment.`;

{"matches":[{"idA":"exact_id_from_contact_data","idB":"exact_id_from_contact_data","score":9,"reason":"2-3 sentences tied to user's specific request"}]}
CRITICAL: idA and idB must be the EXACT id values from the contact data provided. Do not modify or generate new IDs.
If anchor contact given, use their exact id as idA. Score 1-10 (only 6+). Max 8. Sort descending.`;

// ── State ──
var S={
  authed:false,session:null,
  contacts:[],matches:[],
  tab:'contacts',
  filters:{q:'',region:'all',sector:'all',stage:'all',priority:'all'},
  mFilter:'all',
  loading:true,loadError:'',
  parsing:false,matching:false,smartMatching:false,genIntroId:null,genStrategyId:null,
  parsed:null,parseRaw:'',parseMode:'text',pendingFile:null,
  editing:null,expanded:{},mExpanded:{},introText:{},smartResults:null,
  exportOpen:false,enrichTarget:null,enrichData:null,
};

// ── Auth ──
function loadSession(){
  var raw=localStorage.getItem('ss-session');
  if(!raw)return false;
  try{var s=JSON.parse(raw);if(s.token&&s.expires>Date.now()){S.session=s.token;S.authed=true;return true}}catch(e){}
  return false;
}
function storeSession(token){
  var s={token:token,expires:Date.now()+30*24*3600*1000};
  localStorage.setItem('ss-session',JSON.stringify(s));
  S.session=token;S.authed=true;
}

// ── DB / API ──
async function api(path,method,body){
  var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(S.session&&S.session!=='open')opts.headers['Authorization']='Bearer '+S.session;
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch('/api/'+path,opts);
  if(!res.ok){var e=await res.json().catch(function(){return{error:res.statusText}});throw new Error(e.error||res.statusText)}
  return res.json().catch(function(){return null});
}

async function callClaude(sys,userContent,maxTok){
  var messages;
  if(typeof userContent==='string'){messages=[{role:'user',content:userContent}];}
  else{messages=[{role:'user',content:userContent}];}
  var d=await api('claude','POST',{max_tokens:maxTok||1000,system:sys,messages:messages});
  if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  var txt=(d.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
  txt=txt.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // Try 1: direct parse
  try{return JSON.parse(txt)}catch(e1){}
  // Try 2: balanced brace extraction
  var depth=0,bS=-1,bE=-1;
  for(var ci=0;ci<txt.length;ci++){
    if(txt[ci]==='{'){if(depth===0)bS=ci;depth++;}
    else if(txt[ci]==='}'){depth--;if(depth===0){bE=ci;break;}}
  }
  if(bS!==-1&&bE!==-1){try{return JSON.parse(txt.slice(bS,bE+1))}catch(e2){}}
  // Try 3: array fallback
  var aS=txt.indexOf('['),aE=txt.lastIndexOf(']');
  if(aS!==-1&&aE>aS){
    try{return{contacts:JSON.parse(txt.slice(aS,aE+1))}}catch(e3){}
    try{return{matches:JSON.parse(txt.slice(aS,aE+1))}}catch(e4){}
  }
  // Try 4: strip trailing commas
  var fc=txt.replace(/,(\s*[}\]])/g,'$1');
  try{return JSON.parse(fc)}catch(e5){}
  var fcS=fc.indexOf('{'),fcE=fc.lastIndexOf('}');
  if(fcS!==-1&&fcE>fcS){try{return JSON.parse(fc.slice(fcS,fcE+1))}catch(e6){}}
  console.error('Raw AI response:',txt.slice(0,300));
  throw new Error('AI returned unexpected format. Try again or paste less text.');
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

// ── Notifications ──
var _tt;
function toast(msg,dur){var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(_tt);_tt=setTimeout(function(){el.style.display='none'},dur||2800)}
var _si;
function showSaved(){var el=document.getElementById('save-ind');if(!el)return;el.style.display='flex';clearTimeout(_si);_si=setTimeout(function(){el.style.display='none'},2200)}
function flashCopied(text){
  try{navigator.clipboard.writeText(text)}catch(e){}
  var el=document.createElement('div');el.className='copied-flash';el.textContent='Copied: '+text.slice(0,38)+(text.length>38?'...':'');
  document.body.appendChild(el);setTimeout(function(){el.remove()},1700);

// ── HTML helpers ──
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hq(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function rb(r){var x=REGIONS[r]||{label:r,cls:''};return'<span class="badge '+x.cls+'">'+h(x.short||x.label)+'</span>'}
function sb(st){var x=STAGES[st]||{label:st,cls:''};return'<span class="badge '+x.cls+'">'+h(x.label)+'</span>'}
function pb(pr){var x=PRIORITY[pr]||PRIORITY.low;return'<span class="dot '+x.dot+'" style="margin-right:5px"></span>'}

// ── Init ──
async function init(){
  if(loadSession()){await loadData();return}
  // Try open access
  try{
    var r=await api('auth','POST',{password:''});
    if(r.success){storeSession(r.token);await loadData();return}
  }catch(e){}
  S.loading=false;S.authed=false;renderAuth();
}

async function loadData(){
  S.loading=true;renderLoading();
  try{
    var results=await Promise.all([api('contacts'),api('matches')]);
    S.contacts=results[0]||[];S.matches=results[1]||[];
    S.loading=false;checkMigration();render();
  }catch(e){S.loadError=e.message;S.loading=false;renderError()}
}

function checkMigration(){
  var oldK=['gw4-c','gw3-c','gwcrm2-c','gateway-crm-contacts'];
  for(var i=0;i<oldK.length;i++){
    var raw=localStorage.getItem(oldK[i]);
    if(raw&&S.contacts.length===0){
      try{
        var old=JSON.parse(raw);
        if(old&&old.length>0&&confirm('Found '+old.length+' contacts from a previous version. Import them now?')){
          importOldData(old);return;
        }
      }catch(e){}
    }
  }
}

async function importOldData(contacts){
  toast('Importing '+contacts.length+' contacts...',5000);
  try{
    await api('contacts','POST',{action:'import',contacts:contacts});
    var mRaw=localStorage.getItem('gw4-m')||localStorage.getItem('gw3-m');
    if(mRaw){var ms=JSON.parse(mRaw);if(ms&&ms.length)await api('matches','POST',{action:'import',matches:ms})}
    var res=await Promise.all([api('contacts'),api('matches')]);
    S.contacts=res[0]||[];S.matches=res[1]||[];render();toast('Import complete!');
  }catch(e){toast('Import error: '+e.message)}
}

// ── Auth render ──
function renderAuth(){
  document.getElementById('app').innerHTML='<div class="auth-screen"><div class="auth-card">'
    +'<div class="auth-logo">Syner<em>Sage</em></div>'
    +'<p class="auth-tagline">China &middot; Mexico &middot; North America Business Network</p>'
    +'<label class="auth-label">Password</label>'
    +'<input class="auth-input" id="auth-pw" type="password" placeholder="Enter access password" onkeydown="if(event.key===\'Enter\')doLogin()"/>'
    +'<button class="auth-btn" onclick="doLogin()">Access CRM</button>'
    +'<div id="auth-err" class="auth-error"></div>'
    +'</div></div>';
  setTimeout(function(){var e=document.getElementById('auth-pw');if(e)e.focus()},80);
}

async function doLogin(){
  var pw=(document.getElementById('auth-pw')||{}).value||'';
  var btn=document.querySelector('.auth-btn');
  if(btn){btn.disabled=true;btn.textContent='Verifying...'}
  try{
    var r=await api('auth','POST',{password:pw});
    if(r.success){storeSession(r.token);await loadData()}
    else{showAuthErr('Incorrect password')}
  }catch(e){
    if(e.message.includes('401')||e.message.toLowerCase().includes('incorrect')){showAuthErr('Incorrect password')}
    else{showAuthErr(e.message)}
  }
  if(btn){btn.disabled=false;btn.textContent='Access CRM'}
}

function showAuthErr(msg){var e=document.getElementById('auth-err');if(e)e.textContent=msg}

// ── Loading / Error ──
function renderLoading(){
  document.getElementById('app').innerHTML='<div class="loading-screen">'
    +'<div class="loading-brand">Syner<em style="color:#5caa72;font-style:normal">Sage</em></div>'
    +'<div style="display:flex;align-items:center;gap:8px"><span class="spin spin-lg"></span></div>'
    +'<div class="loading-sub">Loading your network...</div>'

}
function renderError(){
  document.getElementById('app').innerHTML='<div class="loading-screen">'

    +'<button class="auth-btn" style="max-width:200px;margin-top:20px" onclick="location.reload()">Retry</button>'
    +'</div>';
}

// ── Main render ──
function render(){
  if(S.loading){renderLoading();return}
  if(S.loadError){renderError();return}
  if(!S.authed){renderAuth();return}
  renderApp();
}

    +'<div class="drop-sep"></div>'
    +'<div class="drop-label">Import</div>'
    +'<div class="drop-item" onclick="triggerImport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Restore from JSON</div>'
    +'<input type="file" id="import-file" accept=".json" style="display:none" onchange="restoreJSON(this)"/>'

    +'</div></div>'
    +'</div>'

    +'<div class="content" id="content"></div>'
    +'</div>'
    +'<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)"></div>';
  renderFilters();renderContent();
}

  var fb=document.getElementById('fbar');if(!fb)return;

    var stChips=['all','exploring','active','ready'].map(function(s){var l=s==='all'?'All Stages':STAGES[s].label;return'<button class="chip '+(S.filters.stage===s?'on':'')+'" onclick="setF(\'stage\',\''+s+'\')">'+l+'</button>'}).join('');
    var prChips=['all','high','medium','low'].map(function(p){var l=p==='all'?'All Priority':PRIORITY[p]?PRIORITY[p].label:p;return'<button class="chip '+(S.filters.priority===p?'on':'')+'" onclick="setF(\'priority\',\''+p+'\')">'+l+'</button>'}).join('');
    var secOpts=SECTORS.map(function(s){return'<option value="'+hq(s)+'" '+(S.filters.sector===s?'selected':'')+'>'+h(s)+'</option>'}).join('');

function renderMatches(ct){
  var ms=S.matches.filter(function(m){return S.mFilter==='all'||m.status===S.mFilter}).sort(function(a,b){return(b.score||0)-(a.score||0)});
  if(!S.matches.length){ct.innerHTML='<div class="tw"><div class="empty"><h3>No matches yet</h3><p>Use Smart Match for targeted introductions, or Run Matchmaking for automatic discovery across all contacts.</p></div></div>';return}
  if(!ms.length){ct.innerHTML='<div class="tw"><div class="empty"><h3>No matches for this filter.</h3></div></div>';return}
  var rows=ms.map(function(m){return matchRow(m)+matchExpRow(m)}).join('');
  ct.innerHTML='<div class="tw"><table><thead><tr>'
    +'<th style="width:40px">Score</th>'
    +'<th style="width:22%">Contact A</th>'
    +'<th style="width:22%">Contact B</th>'
    +'<th style="width:27%">Why this match</th>'
    +'<th style="width:10%">Status</th>'
    +'<th style="width:7%"></th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function matchRow(m){
  var cA=S.contacts.find(function(c){return c.id===m.idA});
  var cB=S.contacts.find(function(c){return c.id===m.idB});
  if(!cA||!cB)return'';
  var sc=m.score>=8?'sc-hi':'sc-md';
  var stOpts=Object.keys(MATCH_ST).map(function(k){return'<option value="'+k+'" '+(m.status===k?'selected':'')+'>'+MATCH_ST[k]+'</option>'}).join('');
  function mp(c){
    var ct2=[c.wechat?'W:'+c.wechat:'',c.whatsapp?'WA:'+c.whatsapp:'',c.email||''].filter(Boolean).slice(0,1).join('');
    return'<div><div style="font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px">'+rb(c.region)+' '+h(c.name||c.company||'')+(m.isSmartMatch&&c.id===m.idA?'<span class="badge b-smart" style="font-size:9px">Smart</span>':'')+'</div>'
      +'<div style="font-size:11px;color:var(--text2)">'+h(c.company||'')+(c.title?' &middot; '+h(c.title):'')+'</div>'
      +(ct2?'<div style="font-size:10px;color:var(--text3)">'+h(ct2)+'</div>':'')+'</div>';
  }
  return'<tr onclick="toggleMExp(\''+hq(m.id)+'\')">'
    +'<td style="padding-left:13px"><div class="score '+sc+'">'+m.score+'</div></td>'
    +'<td>'+mp(cA)+'</td><td>'+mp(cB)+'</td>'
    +'<td style="font-size:11px;color:var(--text2);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:220px">'+h(m.reason||'')+'</td>'
    +'<td><select class="status-sel" onchange="event.stopPropagation();updMStatus(\''+hq(m.id)+'\',this.value)">'+stOpts+'</select></td>'
    +'<td><button class="ibt" onclick="event.stopPropagation();delM(\''+hq(m.id)+'\')" title="Remove">&#215;</button><span style="color:var(--text3);font-size:10px;margin-left:1px">'+(S.mExpanded[m.id]?'&#9650;':'&#9660;')+'</span></td>'
    +'</tr>';
}

  if(!S.mExpanded[m.id])return'<tr class="exp-row" id="mexp-'+m.id+'"><td colspan="6" style="display:none"></td></tr>';
  var cA=S.contacts.find(function(c){return c.id===m.idA});
  var cB=S.contacts.find(function(c){return c.id===m.idB});
  if(!cA||!cB)return'';
  function sHtml(c){
    var rg=REGIONS[c.region]||{label:c.region||'',cls:'',short:''};
    function ctLine(label,val,color){if(!val)return'';return'<div style="display:flex;gap:5px;align-items:center;margin:3px 0"><span style="font-size:10px;color:var(--text3);width:55px;flex-shrink:0;font-weight:600">'+label+'</span><button style="font-size:11px;padding:2px 8px;border-radius:4px;background:'+color+';color:#fff;border:none;cursor:pointer;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="flashCopied(\''+hq(val)+'\')" title="'+hq(val)+'">'+h(val.length>22?val.slice(0,22)+'...':val)+'</button></div>'}
    return'<div class="mx-side"><h5><span class="badge '+rg.cls+'" style="margin-right:5px">'+rg.short+'</span>'+h(c.name||'')+'</h5>'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:2px">'+h(c.company||'')+'</div>'
      +(c.title?'<div style="font-size:11px;color:var(--text2);margin-bottom:10px">'+h(c.title)+'</div>':'')
      +ctLine('WeChat',c.wechat,'#07c160')+ctLine('WhatsApp',c.whatsapp,'#25d366')
      +ctLine('Email',c.email,'#2563eb')+ctLine('Phone',c.phone,'#4f46e5')
      +ctLine('LinkedIn',c.linkedin,'#0a66c2')+ctLine('Other',c.otherContact,'#64748b')
      +(c.intent?'<div style="font-size:10px;color:var(--text3);margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Intent</div><div style="font-size:11px;margin-top:2px">'+h(c.intent)+'</div>':'')
      +(c.budget&&c.budget!=='Unknown'?'<div style="font-size:10px;color:var(--text3);margin-top:6px">Budget: '+h(c.budget)+'</div>':'')
      +(c.offers&&c.offers.length?'<div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:9px;margin-bottom:3px">Offers</div><div>'+(c.offers||[]).map(function(o){return'<span class="offer-tag">'+h(o)+'</span>'}).join('')+'</div>':'')
      +(c.needs&&c.needs.length?'<div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;margin-bottom:3px">Needs</div><div>'+(c.needs||[]).map(function(n){return'<span class="need-tag">'+h(n)+'</span>'}).join('')+'</div>':'')
      +'</div>';
  }
  var intro=S.introText[m.id]||'';
  return'<tr class="exp-row" id="mexp-'+hq(m.id)+'"><td colspan="6"><div class="mx-panel">'
    +'<div class="mx-grid">'+sHtml(cA)+'<div class="mx-arrow">&#8594;</div>'+sHtml(cB)+'</div>'
    +'<div class="mx-reason"><strong>Why introduce:</strong> '+h(m.reason||'')+'</div>'
    +(intro?'<div class="intro-box">'+h(intro)+'</div><button class="btn btn-sm" style="margin-top:8px" onclick="flashCopied(\''+hq(intro)+'\')">Copy message</button>':'')
    +strategyHtml(m)
    +'<div class="mx-actions" style="margin-top:12px">'
    +'<button class="btn btn-primary btn-sm" onclick="genIntro(\''+hq(m.id)+'\')" '+(S.genIntroId===m.id?'disabled':'')+'>'+(S.genIntroId===m.id?'<span class="spin"></span> Generating...':'Generate intro message')+'</button>'
    +(S.genStrategyId===m.id?'':'<button class="btn btn-sm" style="color:#92400e;border-color:#fde68a;background:#fffbf0" onclick="genStrategy(\''+hq(m.id)+'\')">'+(m.strategy?'Refresh Strategy':'Generate Strategy')+'</button>')
    +'<button class="btn btn-sm btn-danger" onclick="delM(\''+hq(m.id)+'\')">Remove match</button>'
    +'</div></div></td></tr>';
}

function strategyHtml(m){
  if(S.genStrategyId===m.id){
    return'<div class="strategy-box"><h4>Strategy</h4><div style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px"><span class="spin spin-d"></span> Generating your monetization strategy...</div></div>';
  }
  if(!m.strategy)return'';
  var s=m.strategy;
  var sections='';
  if(s.opportunity){
    sections+='<div class="strategy-section"><div class="strategy-section-title">Opportunity</div><div class="strategy-section-body">'+h(s.opportunity)+'</div></div>';
  }
  if(s.recommendedModel){
    sections+='<div class="strategy-section"><div class="strategy-section-title" style="color:#7c3aed">Recommended Model</div><div class="strategy-section-body" style="color:#4c1d95;font-weight:500">'+h(s.recommendedModel)+'</div></div>';
  }
  if(s.yourRole){
    sections+='<div class="strategy-section"><div class="strategy-section-title">Your Role</div><div class="strategy-section-body">'+h(s.yourRole)+'</div></div>';
  }
  if(s.feeStructure&&s.feeStructure.length){
    var fees=s.feeStructure.map(function(f){return'<span class="strategy-fee">'+h(f)+'</span>'}).join('');
    sections+='<div class="strategy-section"><div class="strategy-section-title">Fee Options</div><div>'+fees+'</div></div>';
  }
  if(s.estimatedValue){
    sections+='<div class="strategy-section"><div class="strategy-section-title">Estimated Earnings (6-12 months)</div><div class="strategy-section-body" style="font-weight:700;color:#15803d;font-size:13px">'+h(s.estimatedValue)+'</div></div>';
  }
  if(s.actions&&s.actions.length){
    var acts=s.actions.map(function(a,i){return'<div class="strategy-action"><div class="strategy-action-num">'+(i+1)+'</div><div style="font-size:12px;line-height:1.5"><strong>'+h(a.step)+'</strong>'+(a.detail?'<div style="color:var(--text2);margin-top:1px">'+h(a.detail)+'</div>':'')+'</div></div>'}).join('');
    sections+='<div class="strategy-section"><div class="strategy-section-title">Action Plan</div>'+acts+'</div>';
  }
  if(s.watchOut){
    sections+='<div class="strategy-section"><div class="strategy-section-title" style="color:#b91c1c">Watch Out</div><div class="strategy-section-body" style="color:#b91c1c">'+h(s.watchOut)+'</div></div>';
  }
  return'<div class="strategy-box"><h4>Monetization Strategy</h4>'+sections+'</div>';
}

function genStrategy(matchId){
  // Open context dialog first
  var m=S.matches.find(function(x){return x.id===matchId});
  if(!m)return;
  var cA=S.contacts.find(function(c){return c.id===m.idA});
  var cB=S.contacts.find(function(c){return c.id===m.idB});

async function runSmartMatch(){
  var prompt=(document.getElementById('sm-prompt')||{}).value||'';
  var anchorId=(document.getElementById('sm-anchor')||{}).value||'';
  if(!prompt.trim()){toast('Describe what you\'re looking for first.');return}
  if(S.contacts.length<2){toast('Need at least 2 contacts to match.');return}
  var btn=document.getElementById('sm-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin spin-d"></span> Thinking...'}
  var res=document.getElementById('sm-results');
  if(res)res.innerHTML='<div style="text-align:center;padding:24px;color:var(--text2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px"><span class="spin spin-d"></span> Analyzing your contacts...</div>';
  try{
    var anchor=anchorId?S.contacts.find(function(c){return c.id===anchorId}):null;
    var slim=S.contacts.map(function(c){return{id:c.id,name:c.name,title:c.title,company:c.company,companyType:c.companyType,region:c.region,sector:c.sector,offers:c.offers,needs:c.needs,stage:c.stage,priority:c.priority,budget:c.budget,intent:c.intent,marketInterest:c.marketInterest,description:c.description}});
    var userMsg='User request: "'+prompt+'"';
    if(anchor)userMsg+='\n\nAnchor (find matches FOR this person):\n'+JSON.stringify({id:anchor.id,name:anchor.name,company:anchor.company,region:anchor.region,sector:anchor.sector,offers:anchor.offers,needs:anchor.needs,intent:anchor.intent});
    userMsg+='\n\nAll contacts:\n'+JSON.stringify(slim);
    var r=await callClaude(SMART_SYS,userMsg,1600);
    var rawMatches=(r.matches||[]);
    // Build contact lookup by id AND by name (fallback if AI returns wrong id)
    var cById={};S.contacts.forEach(function(c){cById[c.id]=c});
    var cByName={};S.contacts.forEach(function(c){if(c.name)cById[c.name.toLowerCase().trim()]=c;if(c.company)cById[c.company.toLowerCase().trim()]=c});
    function findContact(idOrName){
      if(!idOrName)return null;
      if(cById[idOrName])return cById[idOrName];
      // Fuzzy: try lowercase name/company match
      var key=String(idOrName).toLowerCase().trim();
      return cById[key]||null;
    }
    var newMatches=rawMatches.map(function(m){return Object.assign({},m,{id:uid(),status:'suggested',date:new Date().toISOString().slice(0,10),isSmartMatch:true,smartPrompt:prompt})});
    S.smartResults=newMatches;
    if(!newMatches.length){
      if(res)res.innerHTML='<div style="text-align:center;padding:24px;color:var(--text2);font-size:12px">No strong matches found for your criteria. Try rephrasing.</div>';
    } else {
      var validMatches=[];
      var cards=newMatches.map(function(m,i){
        var cA=findContact(m.idA);
        var cB=findContact(m.idB);
        if(!cA||!cB){
          // Last resort: try partial name match
          cA=cA||S.contacts.find(function(c){return m.idA&&(String(c.id).includes(m.idA)||String(m.idA).includes(c.id))});
          cB=cB||S.contacts.find(function(c){return m.idB&&(String(c.id).includes(m.idB)||String(m.idB).includes(c.id))});
        }
        if(!cA||!cB)return'';
        validMatches.push(i);
        // Update idA/idB to real ids in case AI returned wrong values
        m.idA=cA.id;m.idB=cB.id;
        var sc=m.score>=8?'sc-hi':'sc-md';
        return'<div class="sm-card"><div class="sm-card-top"><div><div class="sm-card-names">'+rb(cA.region)+' '+h(cA.name||cA.company||'')+' &nbsp;&#8594;&nbsp; '+rb(cB.region)+' '+h(cB.name||cB.company||'')+'</div><div class="sm-card-cos" style="margin-top:2px">'+h(cA.company||'')+(cA.company&&cB.company?' &middot; ':'')+h(cB.company||'')+'</div></div><div class="score '+sc+'">'+m.score+'</div></div><div class="sm-card-reason">'+h(m.reason||'')+'</div><div style="margin-top:9px;display:flex;align-items:center;gap:7px"><input type="checkbox" id="smr-'+i+'" checked style="width:13px;height:13px;cursor:pointer"><label for="smr-'+i+'" style="font-size:11px;color:var(--text2);cursor:pointer">Save to matches</label></div></div>';
      }).join('');
      var displayCount=validMatches.length;
      if(displayCount===0){
        // All IDs failed — show error with detail
        if(res)res.innerHTML='<div style="color:var(--red);font-size:12px;padding:12px;background:var(--red-bg);border-radius:var(--r)">AI returned '+newMatches.length+' matches but could not link them to your contacts. Try clicking Find Matches again.</div>';
      } else {
        if(res)res.innerHTML='<p style="font-size:12px;color:var(--text2);margin-bottom:12px">Found <strong>'+displayCount+'</strong> match'+(displayCount!==1?'es':'')+' for your request:</p>'+cards+'<div style="display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)"><button class="btn btn-primary" onclick="saveSmartMatches()">Save Selected</button><button class="btn" onclick="closeModal()">Cancel</button></div>';
      }
    }
  }catch(e){if(res)res.innerHTML='<div style="color:var(--red);font-size:12px;padding:12px;background:var(--red-bg);border-radius:var(--r)">Error: '+h(e.message)+'</div>'}
  if(btn){btn.disabled=false;btn.innerHTML='&#10024; Find Matches'}
}

async function saveSmartMatches(){
  var newMatches=S.smartResults||[];
  var toSave=newMatches.filter(function(m,i){var cb=document.getElementById('smr-'+i);return cb&&cb.checked});
  var existing=new Set(S.matches.map(function(m){return m.idA+'__'+m.idB}));
  toSave=toSave.filter(function(m){return!existing.has(m.idA+'__'+m.idB)});
  if(!toSave.length){toast('No new matches to save.');return}
  try{
    await api('matches','POST',{action:'upsert',matches:toSave});
    S.matches=S.matches.concat(toSave);
    closeModal();toast(toSave.length+' match'+(toSave.length!==1?'es':'')+' saved!');
    S.tab='matches';renderApp();
  }catch(e){toast('Save error: '+e.message)}
}

function handleFileDrop(e){
  e.preventDefault();

  if(file)processFile(file);
}
function handleFileSelect(input){var file=input.files[0];if(file)processFile(file)}
function processFile(file){
  if(file.size>4*1024*1024){toast('File too large. Max 4MB.');return}
  S.pendingFile=file;
  var prev=document.getElementById('file-preview');
  if(prev)prev.innerHTML='<div class="file-preview"><span style="font-size:18px">'+(file.type==='application/pdf'?'📄':'🖼️')+'</span><span class="fn">'+h(file.name)+'</span><span class="fs2">'+Math.round(file.size/1024)+'KB</span><button class="btn btn-ghost btn-sm" onclick="S.pendingFile=null;document.getElementById(\'file-preview\').innerHTML=\'\';document.getElementById(\'file-ext-btn\').style.display=\'none\'">&#215;</button></div>';
  var btn=document.getElementById('file-ext-btn');
  if(btn)btn.style.display='inline-flex';
}

async function doExtractFile(){
  if(!S.pendingFile){toast('Select a file first.');return}
  var btn=document.getElementById('file-ext-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin spin-d"></span> Extracting...'}
  try{
    var reader=new FileReader();
    reader.onload=async function(e){
      var base64=e.target.result.split(',')[1];
      var mediaType=S.pendingFile.type;
      var content;
      if(mediaType==='application/pdf'){
        content=[{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},{type:'text',text:PARSE_SYS+'\n\nExtract all business contacts from this document.'}];
      } else {
        content=[{type:'image',source:{type:'base64',media_type:mediaType,data:base64}},{type:'text',text:PARSE_SYS+'\n\nExtract all business contacts visible in this image (business card, screenshot, document photo, etc.).'}];
      }
      var r=await api('claude','POST',{max_tokens:1200,messages:[{role:'user',content:content}]});
      if(r.error)throw new Error(r.error.message||JSON.stringify(r.error));
      var txt=(r.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
      txt=txt.replace(/```json|```/g,'').trim();
      var parsed;
      try{parsed=JSON.parse(txt)}catch(err){var s2=txt.indexOf('{'),en2=txt.lastIndexOf('}');if(s2!==-1&&en2>s2)parsed=JSON.parse(txt.slice(s2,en2+1));else throw new Error('Could not parse response')}
      S.parsed=(parsed.contacts||[]).map(function(c){return Object.assign({offers:[],needs:[]},c)});
      var mc=document.getElementById('mcontent');if(mc)mc.innerHTML=addInner();
    };
    reader.onerror=function(){toast('Error reading file.');if(btn){btn.disabled=false;btn.innerHTML='Extract from file &rarr;'}};
    reader.readAsDataURL(S.pendingFile);
  }catch(e){toast('Error: '+e.message);if(btn){btn.disabled=false;btn.innerHTML='Extract from file &rarr;'}}
}

async function doExtract(){
  var text=(document.getElementById('pta')||{}).value||S.parseRaw;text=text.trim();
  if(!text){toast('Paste some text first.');return}
  var btn=document.getElementById('ext-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin spin-d"></span> Extracting...'}
  try{
    var r=await callClaude(PARSE_SYS,text,2000);
    S.parsed=(r.contacts||[]).map(function(c){return Object.assign({offers:[],needs:[]},c)});
    S.parseRaw=text;
    var mc=document.getElementById('mcontent');if(mc)mc.innerHTML=addInner();
  }catch(e){toast('Error: '+e.message)}
  if(btn){btn.disabled=false;btn.innerHTML='Extract from text &rarr;'}
}

async function restoreJSON(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var data=JSON.parse(e.target.result);
      var contacts=data.contacts||[];var matches=data.matches||[];
      if(!confirm('Import '+contacts.length+' contacts and '+matches.length+' matches? (Merges, no overwrite)'))return;
      toast('Importing...',5000);

async function runEnrich() {
  var contact = S.enrichTarget;
  if (!contact) return;
  var ctx = (document.getElementById('enrich-ctx') || {}).value || '';
  var btn = document.getElementById('enrich-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin spin-d"></span> Searching...'; }

  var sys = 'You are enriching a business contact profile using web search. Search for this person and return factual information only. Return ONLY valid JSON.\n\nJSON schema:\n{"found":true,"confidence":"high|medium|low","enriched":{"title":"","company":"","website":"","linkedin":"","email":"","description":"2-3 sentences about who they are","companyType":"","sector":"","scale":"","offers":[""],"notes":"any additional context found"},"searchSummary":"1 sentence on what you found and from where"}\n\nOnly include fields where you found real information. Do not guess or fabricate. If you cannot find the person, set found=false.';

  var userMsg = 'Contact to enrich:\n'
    + 'Name: ' + (contact.name || '') + '\n'
    + 'Title: ' + (contact.title || '') + '\n'
    + 'Company: ' + (contact.company || '') + '\n'
    + 'Region: ' + (REGIONS[contact.region] ? REGIONS[contact.region].label : (contact.region || '')) + '\n'
    + 'Sector: ' + (contact.sector || '') + '\n'
    + (ctx ? '\nAdditional context: ' + ctx : '');

  try {
    var r = await api('claude', 'POST', {
      max_tokens: 1000,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      system: sys,
      messages: [{ role: 'user', content: userMsg }]
    });

    if (r.error) throw new Error(r.error.message || JSON.stringify(r.error));

    // Extract text from response (web search responses may have multiple content blocks)
    var txt = (r.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
    txt = txt.replace(/```json|```/g, '').trim();

    var parsed;
    try { parsed = JSON.parse(txt); }
    catch(e) {
      var s2 = txt.indexOf('{'), en2 = txt.lastIndexOf('}');
      if (s2 !== -1 && en2 > s2) parsed = JSON.parse(txt.slice(s2, en2+1));
      else throw new Error('Could not parse response');
    }

    if (!parsed.found) {
      if (btn) { btn.disabled = false; btn.innerHTML = '&#128269; Search &amp; Enrich'; }
      // Show not found in modal
      var mc = document.querySelector('.mbody');
      if (mc) {
        mc.innerHTML += '<div style="margin-top:14px;padding:12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r);font-size:12px;color:var(--amber)">'
          + '<strong>Not found</strong> — Could not find clear information for this contact online. '
          + (parsed.searchSummary || '') + '</div>';
      }
      return;
    }

    // Show enrichment results
    showEnrichResults(contact, parsed);

  } catch(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '&#128269; Search &amp; Enrich'; }
    toast('Search error: ' + e.message);
  }
}

function showEnrichResults(contact, parsed) {
  var enriched = parsed.enriched || {};
  var fields = [
    { key: 'title',       label: 'Title / Role',   current: contact.title },
    { key: 'company',     label: 'Company',        current: contact.company },
    { key: 'website',     label: 'Website',        current: contact.website },
    { key: 'linkedin',    label: 'LinkedIn',       current: contact.linkedin },
    { key: 'email',       label: 'Email',          current: contact.email },
    { key: 'companyType', label: 'Company Type',   current: contact.companyType },
    { key: 'sector',      label: 'Sector',         current: contact.sector },
    { key: 'scale',       label: 'Scale',          current: contact.scale },
    { key: 'description', label: 'Description',    current: contact.description },
  ];

  var rows = fields
    .filter(function(f){ return enriched[f.key] && enriched[f.key] !== f.current; })
    .map(function(f, i){
      return '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">'
        + '<input type="checkbox" id="ef-' + i + '" data-key="' + f.key + '" checked style="margin-top:2px;width:13px;height:13px;cursor:pointer;flex-shrink:0"/>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:2px">' + h(f.label) + '</div>'
        + (f.current ? '<div style="font-size:11px;color:var(--text3);margin-bottom:2px;text-decoration:line-through">' + h(f.current) + '</div>' : '')
        + '<div style="font-size:12px;font-weight:600;color:var(--text)">' + h(enriched[f.key]) + '</div>'
        + '</div></div>';
    });

  // Offers
  var offerRows = '';
  if (enriched.offers && enriched.offers.length) {
    offerRows = '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">'
      + '<input type="checkbox" id="ef-offers" checked style="margin-top:2px;width:13px;height:13px;cursor:pointer;flex-shrink:0"/>'
      + '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:3px">Offers (add to existing)</div>'
      + '<div>' + enriched.offers.map(function(o){ return '<span class="offer-tag">' + h(o) + '</span>'; }).join('') + '</div>'
      + '</div></div>';
  }

  // Notes
  var notesRow = '';
  if (enriched.notes) {
    notesRow = '<div style="margin-top:10px;padding:8px 10px;background:var(--bg2);border-radius:var(--r);font-size:12px;color:var(--text2)">'
      + '<strong>Notes from search: </strong>' + h(enriched.notes) + '</div>';
  }

  var content = (rows.length || offerRows)
    ? '<div style="margin-bottom:6px;font-size:12px;color:var(--text2)">Found <strong>' + (rows.length + (offerRows ? 1 : 0)) + '</strong> field(s) to update. Uncheck any you want to skip:</div>'
      + rows.join('') + offerRows + notesRow
      + '<div style="display:flex;gap:8px;margin-top:16px">'
      + '<button class="btn btn-primary" onclick=\"applyEnrichment()\">'
      + '<button class="btn" onclick="closeModal()">Cancel</button></div>'
    : '<div style="padding:14px;background:var(--bg2);border-radius:var(--r);font-size:12px;color:var(--text2)">Search completed but no new fields found beyond what you already have.</div>'
      + (notesRow || '')
      + '<div style="margin-top:12px"><button class="btn" onclick="closeModal()">Close</button></div>';

  showModal(
    '<div class="modal" onclick="event.stopPropagation()">'
    + '<div class="mhd"><h2>Enrich &uarr;ment Results</h2>'
    + '<div class="sub">' + h(parsed.searchSummary || '') + ' &bull; Confidence: ' + h(parsed.confidence || '') + '</div>'
    + '<button class="ibt" onclick="closeModal()" style="font-size:18px">&#215;</button></div>'
    + '<div class="mbody">' + content + '</div></div>'
  );

  // Store enriched data for applyEnrichment
  S.enrichData = enriched;
  S.enrichFields = fields;
}

async function applyEnrichment() {
  var enriched = S.enrichData || {};
  var contact = S.enrichTarget;
  if (!contact) return;

  // Apply checked fields
  var allFields = ['title','company','website','linkedin','email','companyType','sector','scale','description'];
  allFields.forEach(function(key, i) {
    var cb = document.getElementById('ef-' + i);
    if (cb && cb.checked && enriched[key]) {
      contact[key] = enriched[key];
    }
  });

  // Offers — merge with existing
  var offersCb = document.getElementById('ef-offers');
  if (offersCb && offersCb.checked && enriched.offers && enriched.offers.length) {
    var existing = new Set(contact.offers || []);
    enriched.offers.forEach(function(o){ existing.add(o); });
    contact.offers = Array.from(existing);
  }

  closeModal();
  renderApp();
  try {
    await api('contacts', 'POST', { action: 'upsert', contact: contact });
    showSaved();
    toast('Contact enriched!');
  } catch(e) {
    toast('Save failed: ' + e.message);
  }
}

      + '<button class="btn btn-primary" onclick="applyFileEnrichment()">Apply Selected</button>'
      + '<button class="btn" onclick="closeModal()">Cancel</button></div>'
    : '<div style="padding:14px;background:var(--bg2);border-radius:var(--r);font-size:12px;color:var(--text2)">'
      + (parsed.summary || 'No new fields found beyond what you already have.') + '</div>'
      + notesHtml
      + '<div style="margin-top:12px"><button class="btn" onclick="closeModal()">Close</button></div>';

  S.enrichData = enriched;
  S.enrichFields = FIELD_DEFS;

  showModal(
    '<div class="modal" onclick="event.stopPropagation()">'
    + '<div class="mhd"><h2>&#128196; File Enrichment Results</h2>'
    + (parsed.summary ? '<div class="sub">' + h(parsed.summary) + '</div>' : '')
    + '<button class="ibt" onclick="closeModal()" style="font-size:18px">&#215;</button></div>'
    + '<div class="mbody">' + content + '</div></div>'
  );
};

window.applyFileEnrichment = async function() {
  var contact = S.enrichTarget;
  if (!contact) return;
  var enriched = S.enrichData || {};

  // Apply scalar fields
  (S.enrichFields || []).forEach(function(f, i) {
    var cb = document.getElementById('ffe-' + i);
    if (cb && cb.checked && enriched[f.key]) {
      contact[f.key] = enriched[f.key];
    }
  });

  // Apply array fields
  ['offers', 'needs', 'marketInterest'].forEach(function(key, i) {
    var cb = document.getElementById('ffe-arr-' + i);
    if (cb && cb.checked) {
      var arr = Array.isArray(enriched[key]) ? enriched[key].filter(Boolean) : [];
      if (arr.length) {
        var existing = new Set(Array.isArray(contact[key]) ? contact[key] : []);
        arr.forEach(function(v){ existing.add(v); });
        contact[key] = Array.from(existing);
      }
    }
  });

  closeModal();
  renderApp();
  try {
    await api('contacts', 'POST', { action: 'upsert', contact: contact });
    showSaved();
    toast('Contact updated from file!');
  } catch(e) {
    toast('Save failed: ' + e.message);
  }
};
</script>
</body>
</html>
